<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ===== 題庫資料 =====
const MC = [
  // ===== 商標法 (35%) =====
  { id:1, t:"商標", q:"商標識別性光譜由「弱→強」的正確順序為？", c:["獨創性<任意性<暗示性<描述性<通用名稱","通用名稱<描述性<暗示性<任意性<獨創性","描述性<通用名稱<暗示性<獨創性<任意性","通用名稱<暗示性<描述性<任意性<獨創性"], a:1, e:"識別性光譜（從弱到強）：**通用名稱(generic) → 描述性(descriptive) → 暗示性(suggestive) → 任意性(arbitrary) → 獨創性(fanciful)**。\n口訣：「通描暗任獨」。越往右識別性越強、越易註冊、越難被仿冒混淆。其中通用名稱永遠不能註冊，描述性需取得第二意義才行。" },
  { id:2, t:"商標", q:"「蘋果(Apple)」使用於「電腦產品」，屬於哪一種識別性商標？", c:["描述性商標","通用名稱","任意性商標","暗示性商標"], a:2, e:"**任意性(arbitrary)商標**：商標本身有既有含義（蘋果是一種水果），但與指定的商品（電腦）**完全無關**，沒有傳達電腦的任何資訊。\n對照：若「蘋果」用於「果汁」就變成描述性（說明成分），識別性大降。" },
  { id:3, t:"商標", q:"下列哪一種商標「需要」取得第二意義（後天識別性）才能註冊？", c:["獨創性商標","任意性商標","暗示性商標","描述性商標"], a:3, e:"**描述性商標**先天不具識別性，必須經商業使用、讓消費者產生連結（第二意義 secondary meaning）才能註冊。例如「明通治痛單」、De Beers「鑽石恆久遠」。\n注意：通用名稱即使有第二意義也不得註冊。" },
  { id:4, t:"商標", q:"我國商標權的取得採何種主義？", c:["使用保護主義","註冊保護主義","創作保護主義","公告保護主義"], a:1, e:"我國採**註冊保護主義**（商標法第2條）：要取得商標權須申請註冊。\n對照：美國採**使用主義**（use in commerce）。我國的著名商標縱使未註冊仍受一定保護，且註冊後須繼續使用以維持權利。" },
  { id:5, t:"商標", q:"下列何者「不是」商標法第18條明文列舉的可保護客體？", c:["聲音","氣味","全像圖","動態"], a:1, e:"商標法第18條列舉：**文字、圖形、記號、顏色、立體形狀、動態、全像圖、聲音**等。\n**氣味**未被列舉（雖然條文用「等」字保留彈性，但氣味商標在我國實務上難以註冊，因不易以圖樣明確表示）。" },
  { id:6, t:"商標", q:"「Netflix」(Net+Flick)使用於影音串流服務，最可能屬於？", c:["描述性","暗示性","通用名稱","任意性"], a:1, e:"**暗示性(suggestive)商標**：以間接、譬喻方式暗示服務內容（Net=網路、Flick=電影），消費者需運用**一定程度的想像、推理**才能連結。\n與描述性的差別：描述性是「直接明顯描述」，暗示性需要「想像力」這道橋。" },
  { id:7, t:"商標", q:"判斷商標「混淆誤認之虞」，下列何者「不是」審查基準所列的參考因素？", c:["商標近似程度","商品或服務類似之程度","商標申請人的國籍","相關消費者對各商標熟悉之程度"], a:2, e:"**混淆誤認之虞八要素**：①商標近似程度 ②商品/服務類似程度 ③識別性強弱 ④先權利人多角化經營 ⑤實際混淆情事 ⑥消費者熟悉程度 ⑦申請是否善意 ⑧其他因素。\n「申請人國籍」不在其中。" },
  { id:8, t:"商標", q:"關於「商標淡化」(dilution)，下列敘述何者正確？", c:["任何註冊商標都可主張","僅保護著名商標","必須證明有混淆誤認之虞","與商標識別性無關"], a:1, e:"**商標淡化僅保護「著名商標」**，且**不以混淆誤認為要件**（即使不致混淆，但減損其識別性或信譽即可）。\n分兩種：①減損識別性之虞（沖淡）②減損信譽之虞（玷污）。規定在第30條第1項第11款後段。" },
  { id:9, t:"商標", q:"「池上米」屬於下列哪一種標章？", c:["團體標章","產地證明標章","商標","團體商標"], a:1, e:"**產地證明標章**：證明商品來自特定地理區域且具特定品質。「池上米」是我國最早的產地證明標章，由台東縣池上鄉公所授權使用，證明米產自池上鄉且品質合格。" },
  { id:10, t:"商標", q:"證明標章的申請人有何重要限制？（商標法第81、82條）", c:["必須是政府機關","申請人本身不得從事所證明之商品或服務業務","必須是上市公司","沒有任何限制"], a:1, e:"**申請人本身不得從事其所證明的商品/服務業務**——避免「球員兼裁判」的疑慮，確保證明的公正性。申請人須是有證明能力的法人、團體或政府機關。" },
  { id:11, t:"商標", q:"「團體標章」與「團體商標」最主要的差異是？", c:["團體標章指示商品來源；團體商標表彰會籍","團體標章表彰會員會籍；團體商標指示會員的商品或服務來源","兩者完全相同","團體商標不能註冊"], a:1, e:"**團體標章**：表彰「會員身分/會籍」（如獅子會徽章），不涉及商業來源。\n**團體商標**：指示「會員所提供的商品或服務來源」（商業行為），由團體成員共同使用。" },
  { id:12, t:"商標", q:"商標權的效力範圍採何種主義？", c:["世界主義","屬人主義","屬地主義","折衷主義"], a:2, e:"**屬地主義**：商標權於各註冊國分別有效、效力各自獨立。在台灣註冊不當然在美國受保護。\n馬德里系統（我國未加入）提供單一管道向多國申請的便利，但各國效力仍依其國內法。" },
  { id:13, t:"商標", q:"「描述性商標」與「暗示性商標」的關鍵區別在於？", c:["消費者是否需要運用想像力才能連結商品特性","是否為文字商標","是否為著名商標","是否已經註冊"], a:0, e:"**關鍵在「想像力」這道橋**：\n• 描述性 → 直接、明顯描述商品特性（如「燒烤」用於餐廳），不需想像\n• 暗示性 → 間接、譬喻，消費者需想像、推理才能領會關聯" },
  { id:14, t:"商標", q:"關於「先申請先註冊主義」，下列敘述何者正確？（商標法第22條）", c:["先使用者一定取得商標權","兩人同日以相同近似商標申請而無法辨別先後時，由各申請人協議，不成則抽籤","後申請者優先","完全不需要註冊"], a:1, e:"**先申請先註冊主義**：相同/近似商標用於相同/類似商品時，核准最先申請者。\n同日申請無法辨別先後 → 申請人**協議**，協議不成 → **抽籤**決定（第22條）。" },
  { id:15, t:"商標", q:"「聲明不專用」制度的目的為何？", c:["放棄整個商標","商標包含不具識別性的部分時，聲明該部分不主張專用權，使整體商標得以註冊","延長保護期間","撤銷他人商標"], a:1, e:"**聲明不專用**：當商標含有不具識別性的部分（如說明文字），申請人聲明對「該部分」不主張專用權，讓整體商標仍可註冊。\n注意：若整體都不具識別性，無法靠聲明不專用來救。" },
  { id:16, t:"商標", q:"Christian Louboutin 的紅色鞋底主張商標保護，運用的核心法律概念是？", c:["獨創性","顏色商標透過大量使用取得第二意義（後天識別性）","通用名稱","功能性"], a:1, e:"**顏色商標 + 第二意義**：紅色本身不具先天識別性，但 Louboutin 透過二十多年的大量廣告、媒體報導、銷售成績，使紅底鞋「在時尚圈中明確指向其品牌」，因而取得後天識別性，獲商標保護。" },
  { id:17, t:"商標", q:"我國商標權的保護期間為？", c:["永久有效","自註冊公告日起10年，期滿得申請延展","20年且不得延展","著作人死後50年"], a:1, e:"**商標權自註冊公告日起10年**，期滿可**不斷申請延展**（每次10年），是少數可「永續」的智慧財產權（只要持續使用+延展）。對照：專利和著作權都有確定的到期日。" },
  { id:18, t:"商標", q:"商標法第36條的「合理使用」中，下列何者屬於「描述性合理使用」？", c:["以符合商業交易習慣的誠信方法，表示自己商品的名稱、品質、產地等","抄襲他人著名商標","在相同商品使用相同註冊商標","惡意攀附他人商譽"], a:0, e:"**描述性合理使用**：以善意、符合商業習慣的方式，使用文字來「描述自己商品」的品質、用途、產地等，即使該文字與他人商標相同，也不受商標權拘束（如賣池上產的米標示「池上」產地）。" },
  { id:19, t:"商標", q:"下列關於「著名商標」未註冊時的保護，何者正確？", c:["未註冊的著名商標完全沒有保護","著名商標縱使未註冊，權利人仍可排除他人不當使用","著名商標只能在註冊國保護","著名商標不受混淆誤認規範"], a:1, e:"**著名商標即使未註冊，仍受保護**：權利人可排除他人不當使用（商標法第30條等規定，及公平交易法補充）。這是註冊保護主義的重要例外。" },
  { id:20, t:"商標", q:"商標近似採「異時異地、隔離觀察」原則，其理由是？", c:["因為法官沒時間仔細比對","因為一般消費者是憑模糊印象在不同時間地點重複選購，而非並列比對","因為所有商標都很相似","因為法律強制要求隔很遠看"], a:1, e:"**隔離觀察原則**：真實購物情境中，消費者是憑「模糊的大體印象」在不同時間地點重複選購，**不會把兩個商標並列細看**。所以判斷近似時，細微差異難以發揮區辨功能，應設想實際購買態樣。" },
  { id:21, t:"商標", q:"商標的核心功能是什麼？", c:["美化商品","表彰、辨識商品或服務的來源","必須是公司名稱","只能用於廣告"], a:1, e:"**商標最核心的功能是「表彰來源」(origin identifier)**：讓消費者辨識商品/服務來自哪裡，並擔保其品質（quality and accountability）。其次才有廣告等衍生功能。" },

  // ===== 著作權法 (35%) =====
  { id:22, t:"著作", q:"著作權的保護要件「原創性」，其門檻為何？", c:["必須像專利一樣具備新穎性","門檻很低，只需獨立創作（非抄襲）且具最低程度的創意","必須是世界首創","必須登記才能取得"], a:1, e:"**原創性門檻很低**：只要是著作人「**獨立創作**」（非抄襲），且有「**最低程度的創意**」即可。\n不像專利要求新穎性（世界首創）——你的作品就算與他人雷同，只要是各自獨立完成，都受保護。" },
  { id:23, t:"著作", q:"著作權法第10條之1的「思想與表達二分法」，保護的是？", c:["思想本身","表達，而非其所表達的思想、程序、概念、原理、發現","抽象概念","操作方法"], a:1, e:"**思想表達二分法**（第10條之1）：著作權**只保護「表達」，不保護「思想」**（含程序、製程、系統、操作方法、概念、原理、發現）。\n例：食譜的「文字寫法」受保護，但「烹飪步驟概念」人人可用。" },
  { id:24, t:"著作", q:"下列何者「不」屬於著作人格權？", c:["公開發表權","姓名表示權","重製權","禁止不當修改權（同一性保持權）"], a:2, e:"**著作人格權有三**：①公開發表權 ②姓名表示權 ③禁止不當修改權。\n**重製權屬於「著作財產權」**，不是人格權。記法：人格權關乎「名譽尊嚴」，財產權關乎「金錢利用」。" },
  { id:25, t:"著作", q:"關於著作人格權的敘述，下列何者正確？", c:["可以全部讓與他人","專屬於著作人本身，不得讓與或繼承","可以自由繼承","著作人一死亡即消滅"], a:1, e:"**著作人格權專屬著作人本身，不得讓與或繼承**（第21條）。即使著作人死亡，其人格權的保護「視同生存」，任何人不得侵害。\n對照：著作財產權可以全部或部分讓與、繼承。" },
  { id:26, t:"著作", q:"我國著作財產權的保護期間原則為？", c:["著作完成後50年","著作人生存期間及其死亡後50年","永久保護","著作人死後70年"], a:1, e:"**原則：著作人生存期間 + 死亡後50年**（第30條）。\n注意我國是死後**50年**（不是美國的70年）。期間屆滿後著作進入公共領域，人人可自由利用。" },
  { id:27, t:"著作", q:"下列何者「不」屬於著作財產權？", c:["重製權","改作權","公開傳輸權","姓名表示權"], a:3, e:"**姓名表示權是著作人格權**，不是財產權。\n著作財產權包括：重製、公開口述、公開播送、公開上映、公開演出、公開傳輸、公開展示、改作、編輯、散布、輸入等「利用」相關的權利。" },
  { id:28, t:"著作", q:"判斷「合理使用」的四項基準（著作權法第65條），下列何者「不是」其中之一？", c:["利用之目的及性質（商業或非營利教育）","著作之性質","著作人的知名度","利用結果對著作潛在市場與現在價值之影響"], a:2, e:"**合理使用四基準**：①利用之**目的及性質**（商業/非營利教育、是否轉化）②**著作之性質** ③所利用之**質量及比例** ④對**潛在市場與價值之影響**。\n「著作人知名度」不是基準。" },
  { id:29, t:"著作", q:"合理使用四基準中，「所利用之質量及其在整個著作所占之比例」是指？", c:["利用的商業目的","利用的份量與比重（質與量、占原著作的比例）","對市場的影響","著作的性質"], a:1, e:"**第三基準：質 + 量**。利用越多、或利用到原著作的「核心精華」（質的重要性），越不利於合理使用認定。即使只引用少量，但若是最關鍵的部分，仍可能不構成合理使用。" },
  { id:30, t:"著作", q:"「製版權」保護的是什麼？", c:["有原創性的新創作","無著作財產權（或已消滅）的文字著述或美術著作，經製版人整理印刷後的首次重製權","商標標識","發明技術"], a:1, e:"**製版權**：保護「無著作財產權或財產權已消滅」的古老文字/美術著作，經製版人花心力整理印刷後的**首次重製排版**。保護期間**10年**。目的是鼓勵整理出版古籍。" },
  { id:31, t:"著作", q:"出資聘請他人完成著作，若雙方未約定，著作財產權歸屬？（著作權法第12條）", c:["一律歸出資人","原則上以受聘人為著作人，但出資人得在出資目的範圍內利用該著作","一律歸國家","無人享有"], a:1, e:"**出資聘人（第12條）**：未約定時，**以受聘人（實際創作者）為著作人**，享有著作權；但**出資人得利用**該著作。\n對照職務著作（第11條，受雇關係）：未約定時著作人是受雇人，但財產權歸雇用人。" },
  { id:32, t:"著作", q:"著作權與專利權對「原創性／新穎性」的要求差異為何？", c:["著作權要求比專利高","著作權的原創性門檻遠低於專利的新穎性，只需獨立創作且有最低創意","兩者完全相同","著作權完全不要求原創性"], a:1, e:"**著作權原創性 << 專利新穎性**：\n• 著作權：只要獨立創作、非抄襲、有微量創意即可\n• 專利：須是「世界首創」（新穎性）+ 進步性\n所以兩人各自畫出相似的畫都受著作權保護，但專利同樣技術只給最先申請者。" },
  { id:33, t:"著作", q:"下列何者「不」受著作權保護？（著作權法第9條）", c:["小說","憲法、法律、命令或公文","繪畫","音樂"], a:1, e:"**第9條排除**：①憲法、法律、命令、公文 ②單純為傳達事實的新聞報導 ③標語及通用符號 ④單純數表表格 ⑤依法令舉行的考試試題等。\n這些基於公益或不具原創性而不受保護。" },
  { id:34, t:"著作", q:"著作權保護「表達」而非「思想」，下列何者屬於受保護的「表達」？", c:["數學公式","小說的劇情、故事架構、角色特質與外型","科學原理","操作方法"], a:1, e:"**可受保護的「表達」**包括文字，以及非文字部分如：小說/戲劇的**劇情、故事架構、事件時序、角色特質與外型**，甚至視聽著作的「整體觀感」(total concept and feel)。\n數學公式、科學原理、操作方法屬「思想」，不受保護。" },
  { id:35, t:"著作", q:"關於著作人格權可否讓與，我國法的立場較接近？", c:["一元論，人格權可讓與","二元論，著作人格權專屬著作人不得讓與或繼承","人格權可自由繼承","財產權不可讓與"], a:1, e:"**我國採近「二元論」**：著作財產權與人格權分立。\n• 人格權 → 專屬著作人，不得讓與/繼承\n• 財產權 → 可全部或部分讓與、繼承\n（一元論則視兩者為一體不可分）" },
  { id:36, t:"著作", q:"著作財產權的「散布權」與「第一次銷售原則（權利耗盡）」，下列敘述何者正確？", c:["著作財產權人可永遠控制每一份重製物的轉售","合法重製物經第一次銷售後，該特定重製物的後續轉售不再受散布權控制","散布權根本不存在","散布權永久有效"], a:1, e:"**第一次銷售原則 / 權利耗盡**：你買的正版書，第一次合法銷售後，著作權人對「那一本」的散布權就「耗盡」了——你可以自由轉賣、贈送。否則二手書店都違法了。" },
  { id:37, t:"著作", q:"「公開發表權」屬於著作人格權，下列何種情況「推定」著作人同意公開發表？", c:["著作人將尚未發表著作的財產權讓與他人，因財產權行使而公開發表","他人擅自盜版上傳","著作人明確表示反對","任何情況都推定同意"], a:0, e:"**第15條推定同意公開發表**的情形：①著作人讓與/授權尚未發表著作的財產權，因其行使而公開發表 ②讓與美術或攝影著作原件，受讓人公開展示。屬於人格權與財產權衝突時的調和。" },
  { id:38, t:"著作", q:"一張攝影作品的「原創性」如何展現？", c:["必須具備如專利的高度新穎性","攝影者對拍攝主題、對象、角度、光線等的選擇與安排","只要按下快門就絕對沒有原創性","攝影一律不受保護"], a:1, e:"**攝影著作的原創性**展現在攝影者的「**選擇與安排**」：拍攝主題、對象、構圖角度、光線、時機等創作判斷。實務認為這展現了著作人的個性與精神作用，故受保護（門檻很低）。" },
  { id:39, t:"著作", q:"著作權法上的「改作」是指？", c:["單純重製（原樣複製）","以翻譯、編曲、改寫、拍攝影片或其他方法，就原著作另為創作","公開展示原件","散布重製物"], a:1, e:"**改作（第3條）**：就原著作「另為創作」——翻譯、編曲、改寫、拍成電影、改編漫畫等。改作須經原著作財產權人同意（改作權），改作完成的「衍生著作」本身也獨立受保護。" },
  { id:40, t:"著作", q:"下列關於著作權「取得方式」的敘述，何者正確？", c:["必須向主管機關登記才取得","著作完成即自動取得（創作保護主義），不需登記或審查","必須申請實體審查","必須繳納年費維持"], a:1, e:"**創作保護主義**：著作一經「完成」即自動享有著作權，**不需登記、註冊或審查**。\n對照：商標、專利都採「註冊/申請主義」，必須經過申請程序。" },
  { id:41, t:"著作", q:"合理使用判斷中的「轉化性使用」(transformative use)，主要影響哪一項基準？", c:["利用之目的及性質","著作之性質","保護期間","著作人國籍"], a:0, e:"**轉化性使用影響第一基準（利用之目的及性質）**：若利用賦予原著作新的意義、訊息或目的（如評論、諧仿、二次創作），而非單純取代原著作，則較有利於合理使用認定。" },
  { id:42, t:"著作", q:"「編輯著作」（如資料庫、選集）受著作權保護的理由是？", c:["對資料的「選擇與編排」具有原創性","資料本身有經濟價值","編輯花了很多錢","編輯者很有名"], a:0, e:"**編輯著作**：就資料的「**選擇與編排**」展現原創性而受保護（保護的是編排巧思，不是個別資料）。即使所收錄資料本身不受保護（如電話號碼），其獨特的選編方式仍可受保護。" },

  // ===== 專利法 (10%) =====
  { id:43, t:"專利", q:"我國專利法將專利分為哪三種？", c:["發明、新型、設計","實用、外觀、植物","商標、著作、發明","物品、方法、用途"], a:0, e:"我國三種專利：**發明專利、新型專利、設計專利**。\n對照：美國分 utility（實用）、design（設計）、plant（植物）三種；巴黎公約則為 patent 與 utility model。" },
  { id:44, t:"專利", q:"三種專利的保護期間，下列何者正確？", c:["發明20年、新型10年、設計15年","全部都是20年","發明10年、新型20年、設計5年","全部永久"], a:0, e:"**保護期間**（自申請日起算）：\n• 發明專利 → **20年**\n• 新型專利 → **10年**\n• 設計專利 → **15年**\n記法：發明最高階、保護最久。" },
  { id:45, t:"專利", q:"「永動機」無法取得專利的主要原因是？", c:["設計太複雜","違反自然法則（能量/質量守恆），不具產業利用性","沒有人申請","結構太簡單"], a:1, e:"**永動機違反自然法則**（能量守恆/質量守恆定律），實際上無法製造運作，因此**不具產業利用性（enablement）**，不屬於可專利的「發明」。" },
  { id:46, t:"專利", q:"下列何者「不」屬於專利法保護的「發明」？", c:["改良的化學物質","數學公式、遊戲規則（非利用自然法則）","產品的製造方法","半導體裝置"], a:1, e:"**發明須「利用自然法則之技術思想」**。\n非發明類型：①自然法則本身 ②單純發現 ③違反自然法則（永動機）④**非利用自然法則者：數學公式、遊戲規則、商業方法、心智步驟** ⑤單純技術思想/資訊揭示。" },
  { id:47, t:"專利", q:"新型專利與發明專利在「審查標準」上的主要差異是？", c:["新型採實體審查、發明採形式審查","新型採形式審查（較寬鬆）、發明採實體審查（較嚴格）","兩者審查完全相同","新型不需審查"], a:1, e:"**審查差異**：\n• 發明專利 → **實體審查**（嚴格審查新穎性、進步性等）\n• 新型專利 → **形式審查**（較寬鬆，只查格式形式）\n所以新型較快取得，但權利較不穩定。新型限「物品的形狀、構造或組合」。" },
  { id:48, t:"專利", q:"設計專利保護的重點是？", c:["技術思想的功能改良","物品外觀的視覺訴求（形狀、花紋、色彩），具「物品性」與「視覺性」","產品的製造方法","抽象的自然法則"], a:1, e:"**設計專利**重視「**物品外觀的視覺設計**」：\n• 物品性 → 須應用於物品外觀、供產業利用\n• 視覺性 → 對視覺的具體設計，不須功能改良\n與發明/新型（重技術功能）不同。電腦圖像(icon)與GUI也可申請。" },

  // ===== 營業秘密法 (10%) =====
  { id:49, t:"營業秘密", q:"營業秘密的三大要件為？（營業秘密法第2條）", c:["新穎性、進步性、產業利用性","秘密性（非周知）、經濟價值、合理保密措施","識別性、第二意義、註冊","原創性、固定、發表"], a:1, e:"**營業秘密三要件**：\n①**秘密性**——非一般涉及該類資訊之人所知\n②**經濟價值**——因秘密性而有實際或潛在經濟價值\n③**合理保密措施**——所有人已採取合理保密。\n三者缺一不可。經典例子：可口可樂配方。" },
  { id:50, t:"營業秘密", q:"我國對營業秘密「秘密性」的判斷採何種標準？", c:["公眾標準（一般民眾）","業界標準（非一般涉及該類資訊之人所知）","全球公開標準","政府認定標準"], a:1, e:"我國採**業界標準**（同 TRIPS 第39(2)條）：只要「非一般涉及該類資訊之**業界人士**所知」即具秘密性。\n對照：日本、美國採**公眾標準**（一般民眾是否知悉）。" },
  { id:51, t:"營業秘密", q:"以「還原工程」(reverse engineering)取得他人營業秘密，原則上？", c:["屬於不正當方法","原則上屬於正當方法","一律違法","必須事先申請許可"], a:1, e:"**還原工程原則上是正當方法**：合法取得產品後，自行拆解分析而得知其秘密，並不違法。這也是營業秘密保護的內在限制——你保護不了「別人能合法逆向破解的東西」。" },
  { id:52, t:"營業秘密", q:"下列何者「不」屬於營業秘密法第10條的「不正當方法」？", c:["竊盜","賄賂","還原工程","違反保密義務"], a:2, e:"第10條「不正當方法」例示：**竊盜、詐欺、脅迫、賄賂、擅自重製、違反保密義務、引誘他人違反保密義務**或其他類似方法。\n**還原工程不在內**（原則上正當）。" },
  { id:53, t:"營業秘密", q:"客戶名單若僅有名稱、地址、聯絡方式，且可於市場輕易查得，是否構成營業秘密？", c:["一定構成","通常難認有秘密性及經濟價值，不構成","永遠構成","與名單內容無關"], a:1, e:"依智財法院107年度民營訴字第2號：**僅有名稱、地址、聯絡方式且可輕易查得的客戶名單，難認有秘密性及經濟價值**。\n但若包含客戶喜好、特殊需求、決策名單等「經整理分析」的資訊，則可能構成。" },
  { id:54, t:"營業秘密", q:"營業秘密遭侵害的「損害賠償請求權」時效為？（第12條）", c:["自知悉時起2年、自行為時起10年","永久可請求","自知悉時起1年","自知悉時起50年"], a:0, e:"**損害賠償時效（第12條）**：自請求權人「知有行為及賠償義務人時起**2年**」不行使而消滅；自「行為時起逾**10年**」者亦同。（短期2年 + 長期10年雙重時效）" },

  // ===== 綜合 (10%) =====
  { id:55, t:"綜合", q:"下列關於各智慧財產權「保護期間」的比較，何者正確？", c:["商標永久不需任何動作、營業秘密20年、著作權死後70年","商標自註冊公告起10年得延展、發明專利20年、著作權著作人死後50年、營業秘密至公開為止","全部都是20年","全部都永久"], a:1, e:"**保護期間總整理**：\n• 商標 → 10年（**可不斷延展**）\n• 發明專利20年 / 新型10年 / 設計15年（**到期消滅**）\n• 著作權 → 著作人**死後50年**\n• 營業秘密 → **至秘密公開為止**（無固定期間）" },
  { id:56, t:"綜合", q:"同一個產品的「外觀設計」，可能同時受哪些智慧財產權保護？", c:["設計專利、著作權（美術著作）、甚至立體商標","只能受專利保護","只能受商標保護","完全不能受任何保護"], a:0, e:"**一物可多權併存**：產品外觀可能同時是\n• 設計專利（視覺設計）\n• 著作權（若具原創性的美術著作）\n• 立體商標（若取得識別性/第二意義）\n三者保護重點不同，可疊加。例如精品包的造型。" },
  { id:57, t:"綜合", q:"「約定」競業禁止受勞動基準法第9條之1限制，下列何者「不是」其四要件之一？", c:["雇主有應受保護的正當營業利益","勞工的職位或職務能接觸或使用雇主的營業秘密","勞工必須是公司高階主管","雇主對勞工不從事競業的損失有合理補償"], a:2, e:"**勞基法第9條之1四要件**：①雇主有正當營業利益 ②勞工**能接觸/使用營業秘密** ③期間、區域、職業範圍、對象未逾合理 ④雇主有**合理補償**。\n與「職位高低」無關。違反任一要件，約定無效。" },
  { id:58, t:"綜合", q:"離職後競業禁止的期間，依勞基法最長不得逾多久？", c:["1年","2年（逾2年者縮短為2年）","5年","無限制"], a:1, e:"**離職後競業禁止最長2年**（勞基法第9條之1第4項）：逾2年者，縮短為2年。\n注意：合理補償**不包括**勞工在職期間所領的薪資。" },
  { id:59, t:"綜合", q:"下列關於四種智慧財產權「保護客體」的配對，何者「錯誤」？", c:["專利—發明、新型、設計","商標—具識別性的標識","著作權—具原創性的著作","營業秘密—必須註冊才受保護的資訊"], a:3, e:"**營業秘密「不需註冊」**——它的核心正是「保持秘密」，註冊反而會公開。這與商標、專利的「註冊/申請主義」相反。\n其他三個配對都正確。" },
  { id:60, t:"綜合", q:"智慧財產權的三大保護原理，下列配對何者正確？", c:["洛克勞動理論→天賦權利(Natural Rights)；黑格爾→人格理論(Personhood)；功利主義→經濟誘因(Utilitarian)","洛克→經濟誘因","黑格爾→天賦權利","功利主義→人格延伸"], a:0, e:"**三大保護原理**：\n①**洛克（Locke）勞動理論** → 天賦權利：付出勞動就該擁有成果\n②**黑格爾（Hegel）人格理論** → 財產是人格的延伸\n③**功利主義/經濟誘因** → 用排他權提供誘因促進創新（美國憲法 Art. I §8）" },

  // ===== 進階題 (d:2) =====
  // ===== 商標進階 (61-80) =====
{ id:61, t:"商標", d:2, q:"在「a2 MILK」商標爭議中，最高行政法院認定該商標屬「暗示性商標」（而非雀巢主張的描述性）。下列推論何者最正確？", c:["既為暗示性商標，國內競爭同業仍可選擇「A2-β酪蛋白」等文字直接描述商品成分，不受該商標權拘束","既為暗示性商標，他人完全不得使用任何含「A2」的文字","暗示性商標不具識別性，故不得註冊","暗示性商標與描述性商標相同，皆須取得第二意義"], a:0, e:"法院認定 a2 MILK 是**暗示性商標**（需想像才能連結成分）。關鍵推論：既然是暗示性而非「商品本身的直接描述」，**競爭同業仍能用「A2-β酪蛋白」等更直接的文字說明商品**（受第36條合理使用保護），所以給予 a2 MILK 專用權不會妨礙公平競爭。" },
{ id:62, t:"商標", d:2, q:"關於商標近似判斷中「整體觀察」與「主要部分觀察」的關係，下列何者最符合實務見解（釋字594徐璧湖協同意見）？", c:["必須先強行區分主要與附屬部分，再單獨比對主要部分","以整體觀察為原則；縱主要部分非近似，但整體觀察有混淆誤認之虞者，仍構成近似","只比對主要部分，附屬部分一律不看","整體觀察與主要部分觀察互斥，只能擇一適用"], a:1, e:"實務**以整體觀察為原則**：消費者通常看整體的模糊印象，不會分辨主要/附屬部分。因此縱使主要部分不近似，但附屬部分近似而整體足生混淆誤認者，仍為近似。不必先強分主要部分（有時也難以區分）。" },
{ id:63, t:"商標", d:2, q:"甲在台灣註冊「HJ」速食店商標；乙在澳洲早已長期使用相同商標。乙進入台灣市場時與甲發生爭議。依屬地主義，下列何者正確？", c:["乙在澳洲的商標權自動延伸至台灣，甲的註冊無效","商標權於各國效力獨立，乙在澳洲的權利不當然在台灣受保護","全世界商標一體適用，先使用者全球優先","台灣必須承認澳洲的商標權"], a:1, e:"**屬地主義**：商標權於各註冊國分別發生、效力各自獨立。乙在澳洲有權利，不代表在台灣自動受保護。這也是國際品牌進入新市場常見的搶註爭議來源（影射 Hungry Jacks/Burger King 案）。" },
{ id:64, t:"商標", d:2, q:"比較「商標淡化」與「混淆誤認之虞」對商標近似程度的要求，下列何者正確？", c:["兩者要求的近似程度相同","商標淡化在判斷時，對近似程度的要求應較混淆誤認之虞「更高」","商標淡化完全不要求近似","混淆誤認之虞才只保護著名商標"], a:1, e:"**商標淡化對近似程度的要求較高**：因淡化是直接保護著名商標本身（不以混淆為要件），若連近似度都不夠，難認其識別性或信譽會被減損。商標若相同，較易證明有減損之虞。" },
{ id:65, t:"商標", d:2, q:"「Baby Boss」與著名「Hugo Boss」的爭議中，假設兩者商品市場區隔明顯、不致使消費者混淆，著名商標權人仍可能主張何種保護？", c:["一般混淆誤認之虞","減損著名商標識別性或信譽之虞（商標淡化，第30條第1項第11款後段）","完全無法主張任何權利","主張著作權侵害"], a:1, e:"即使不致混淆（市場區隔），著名商標仍可依**第30條第1項第11款「後段」**主張**商標淡化**——他人使用可能沖淡（減損識別性）或玷污（減損信譽）著名商標。這是對著名程度較高商標的加強保護。" },
{ id:66, t:"商標", d:2, q:"比較商標法第30條第1項第10款（他人先註冊商標）與第11款（著名商標）的保護範圍，下列何者正確？", c:["第10款保護未註冊商標，第11款保護註冊商標","第11款（著名商標）保護範圍可跨越至「不類似」的商品/服務，第10款原則限於同一或類似商品/服務","兩款保護範圍完全相同","第10款的保護範圍比第11款更廣"], a:1, e:"**著名商標（第11款）保護範圍更廣**，可跨類保護（甚至及於不類似商品），因為著名商標的識別性與信譽更需保護；**第10款**（一般先註冊商標）原則上限於**同一或類似**商品/服務範圍。" },
{ id:67, t:"商標", d:2, q:"關於「聲明不專用」，下列敘述何者「錯誤」？", c:["商標含不具識別性部分時，聲明該部分不專用後，整體商標仍可能取得註冊","已聲明不專用的部分，在判斷混淆誤認之虞時一律完全不納入考量","若商標整體都不具識別性，無法靠聲明不專用取得註冊","聲明不專用的目的在釐清商標專用權的範圍"], a:1, e:"錯誤在 B。**聲明不專用的部分仍可能影響混淆誤認之虞的判斷**——它只是表明對該部分不單獨主張專用權，但在整體商標的近似判斷時，該部分仍會被消費者施以一定注意力，故仍可能納入考量。" },
{ id:68, t:"商標", d:2, q:"商標圖樣中包含「功能性」部分，依112年修正的商標法第30條第4項，下列何者正確？", c:["功能性部分一律可以註冊","商標圖樣含功能性部分而未以「虛線」方式呈現者，不得註冊","功能性部分必須以實線清楚呈現才能註冊","功能性與註冊與否無關"], a:1, e:"基於公益考量，**功能性部分不應由一人獨占**。修法明定：含功能性部分而未以**虛線**方式呈現（即未排除於專用範圍）者，不得註冊。虛線是用來表示「不主張該部分」。" },
{ id:69, t:"商標", d:2, q:"比較美國「使用主義」與我國「註冊主義」，下列敘述何者正確？", c:["美國聯邦法（Lanham Act）下，註冊是取得商標保護的唯一必要條件","美國法的「intent to use」(ITU) 等同於「實際使用」","美國商標註冊滿5年可成為「incontestable」（不可爭議），為註冊的一大優點","我國採使用主義，不需註冊即有完整商標權"], a:2, e:"美國採**使用主義**（use in commerce），註冊**非**取得保護的必要條件（但有優點：等同 constructive use、滿5年變 incontestable 不可爭議、可主張特定救濟）。ITU（意圖使用）不等於實際使用。我國則採**註冊主義**。" },
{ id:70, t:"商標", d:2, q:"「鑽石恆久遠 一顆永流傳」原本是不具先天識別性的廣告標語，但 De Beers 長期大量使用後仍獲商標保護。此說明何種法律概念？", c:["該標語透過商業使用取得第二意義（後天識別性）而得註冊","通用名稱經使用即可註冊","廣告標語一律不得註冊","暗示性商標不需任何使用即受保護"], a:0, e:"**第二意義（後天識別性 / secondary meaning）**：原本不具識別性的標語，經持續廣泛的商業使用，使消費者將它與特定來源連結，即可取得識別性而註冊（最高行政法院96年判字第753號）。" },
{ id:71, t:"商標", d:2, q:"汽車維修廠在招牌標示「專業維修 BMW、賓士」，以說明其服務對象。此最可能屬於？", c:["指示性合理使用（用他人商標指示該他人之商品/服務）","商標侵害","描述性合理使用","商標淡化"], a:0, e:"**指示性合理使用**：為了指示「該他人的商品/服務」而使用其商標（如維修廠說明可修哪些品牌、相容耗材標明適用機型），只要符合誠信、不致使人誤認來源，即屬合理使用。" },
{ id:72, t:"商標", d:2, q:"關於商標法與公平交易法的適用關係，下列何者正確？", c:["兩者立法目的完全無關","公平交易法可補充規範商標法未規範的行為（如表徵仿冒、搭便車、攀附商譽等）","商標法完全取代公平交易法，二者不得併用","公平交易法只規範著作權"], a:1, e:"兩者共同目的都是**維護市場公平競爭**。商標法以商標權人的專屬排他權為中心；公平交易法則**補充**規範商標法未及的不公平競爭行為（表徵仿冒、攀附商譽等冒用行為）。" },
{ id:73, t:"商標", d:2, q:"在先申請先註冊主義下，判斷「商品是否類似」時，應以何者為比對基礎（依103行商訴149）？", c:["應比對「申請或註冊登記的指定商品」，而非商標實際使用的商品","只看商標實際使用的商品","不需判斷商品類似","以消費者實際購買行為為唯一準據"], a:0, e:"基於**先申請先註冊主義**，商品類似與否應比對「**申請/註冊登記的指定商品**」，而非實際使用的商品。因為權利範圍是依註冊指定的範圍劃定的。" },
{ id:74, t:"商標", d:2, q:"甲的「Apple」商標（任意性、識別性極強）與乙的近似商標發生爭議。商標識別性強弱如何影響混淆誤認判斷？", c:["識別性強弱與混淆誤認難易度無關","識別性越強的商標，消費者印象越深刻，他人稍有攀附即越容易致生混淆誤認（識別性與混淆成正比）","識別性越強越不容易被混淆，故較不受保護","識別性強的商標不受混淆誤認規範"], a:1, e:"實務見解：**識別性與混淆誤認成正比**。識別性越強的商標，消費者印象越深、越熟悉，他人若使用近似商標攀附，反而越容易使消費者產生混淆誤認，故識別性強的商標保護程度也越高。" },
{ id:75, t:"商標", d:2, q:"關於「動態商標」與「全像圖商標」，下列敘述何者正確？", c:["動態商標指影像動態變化所產生的整體商業印象；全像圖商標利用全像術呈現立體影像並具來源識別功能","全像圖商標在我國一律不能註冊","兩者都屬於傳統商標","動態商標只能由聲音構成"], a:0, e:"兩者都是**非傳統商標**。動態商標（motion mark）保護的是影像動態的「整體商業印象」；全像圖（hologram）利用全像術呈現隨角度變化的立體影像，本身須具來源識別功能。" },
{ id:76, t:"商標", d:2, q:"下列何者「不」屬於商標法第30條第1項所定的不得註冊事由？", c:["妨害公共秩序或善良風俗","與著名商標近似而有致混淆誤認之虞","含有他人著名的姓名或藝名（未經其同意）","商標具有高度獨創性"], a:3, e:"**獨創性是識別性最強的「積極要件」**，不是不得註冊的事由（反而最容易准予註冊）。第30條的不得註冊事由包括：妨害公序良俗、著名商標混淆、他人著名姓名/藝名未同意、功能性等。" },
{ id:77, t:"商標", d:2, q:"某商標由「中文+圖形」聯合式組成，欲與另一「單純文字」商標比對近似。下列何者最正確？", c:["只比對文字部分","只比對圖形部分","以整體商標圖樣為觀察，綜合外觀、讀音、觀念三方面判斷","完全不需比對，因類型不同即不近似"], a:2, e:"商標近似應以**整體商標圖樣**為觀察對象，綜合**外觀、讀音、觀念**三方面判斷（如「小時光麵館」案）。即使一個是聯合式、一個是純文字，仍須整體比對是否有致混淆誤認。" },
{ id:78, t:"商標", d:2, q:"關於我國未加入「馬德里系統」的影響，下列何者正確？", c:["台灣的申請人無法透過馬德里系統的「單一管道」向多個會員國一次申請","台灣自動成為馬德里系統會員","馬德里系統是著作權的國際註冊制度","台灣人完全無法在外國申請商標"], a:0, e:"**馬德里系統**讓申請人透過單一管道、繳一組費用，向多個會員國申請商標。**台灣未加入**，故台灣申請人不能用此便利管道（須個別向各國申請）。注意馬德里系統是商標制度，不是著作權。" },
{ id:79, t:"商標", d:2, q:"某外國地理標示（如某產區葡萄酒）未在我國取得產地證明標章或產地團體商標。下列何者正確？", c:["完全無法在我國獲得任何保護","仍得依商標法第30條第1項第8款及第9款規定，排除他人以該地理標示申請商標或標章之註冊","必須先註冊為商標才有保護","地理標示與商標法完全無關"], a:1, e:"即使未取得產地證明標章/產地團體商標，地理標示**仍可依第30條第1項第8、9款排除他人註冊**（防止他人搭便車）。這呼應 TRIPS 第22條對地理標示的保護要求。" },
{ id:80, t:"商標", d:2, q:"比較「產地證明標章」與「產地團體商標」的使用對象，下列何者正確？", c:["產地證明標章是封閉式（僅限會員），產地團體商標是開放式","產地證明標章是開放式（符合使用規範及條件者皆可使用），產地團體商標是封閉式（僅提供會員使用）","兩者都是開放式","兩者都是封閉式"], a:1, e:"**產地證明標章=開放式**：只要符合所訂使用規範及條件者「皆可」使用（申請人本身不能用）。**產地團體商標=封閉式**：僅提供其「會員」使用。這是兩者的關鍵差異。" },

// ===== 著作進階 (81-100) =====
{ id:81, t:"著作", d:2, q:"甲寫食譜，詳述「先打蛋、再加麵粉」的烹飪步驟。乙照著做菜，並用自己的文字寫成另一本食譜描述相同步驟。依思想與表達二分法，下列何者最正確？", c:["乙侵害甲的著作權，因烹飪步驟相同","烹飪步驟屬「思想/方法」不受保護，乙用自己的文字表達不構成侵害","食譜完全不受著作權保護","甲可禁止任何人依該步驟做菜"], a:1, e:"**思想表達二分法（第10條之1，Baker v. Selden 精神）**：著作權保護「文字表達」，不保護「方法、步驟（思想）」。甲食譜的「文字」受保護，但「烹飪步驟本身」是思想，人人可用。乙用自己的文字描述同一步驟，不構成侵害。" },
{ id:82, t:"著作", d:2, q:"甲、乙兩位攝影師在同一地點、不同時間各自拍下構圖極相似的照片。依著作權「原創性」的特性，下列何者正確？", c:["後拍者侵害先拍者著作權","只要各自獨立創作（非抄襲）且有最低創意，兩張照片都各自受著作權保護","只有先拍的受保護","攝影需達專利新穎性才受保護"], a:1, e:"著作權的**原創性只要求「獨立創作」+「最低創意」，不要求世界首創**（不同於專利新穎性）。兩人各自獨立完成、未互相抄襲，縱使成果雷同，**都各自享有著作權**。" },
{ id:83, t:"著作", d:2, q:"甲受僱於乙公司，在職務上完成一套程式，雙方未特別約定著作權歸屬。依著作權法第11條，下列何者正確？", c:["以受雇人（甲）為著作人，但著作財產權歸雇用人（乙）","著作人格權與財產權都歸甲","著作人格權與財產權都歸乙","程式無人享有著作權"], a:0, e:"**職務著作（第11條）**未約定時：以**受雇人（甲）為著作人**（享有人格權），但**著作財產權歸雇用人（乙）**。這是雇傭關係的預設規則。" },
{ id:84, t:"著作", d:2, q:"比較著作權法第11條（職務著作）與第12條（出資聘人）在「未約定」時的差異，下列何者正確？", c:["兩者的財產權歸屬完全相同","職務著作財產權原則歸雇用人；出資聘人則以受聘人為著作人並享有財產權，出資人僅得利用","職務著作財產權歸受雇人；出資聘人財產權歸出資人","兩者的著作人都是出資/雇用方"], a:1, e:"**關鍵差異**：①職務著作（受雇）→ 著作人是受雇人、**財產權歸雇用人** ②出資聘人 → **以受聘人為著作人並享有財產權**，出資人僅「得利用」。記法：聘僱（雇用人拿財產權）vs 出資（受聘人拿，出資人只能用）。" },
{ id:85, t:"著作", d:2, q:"甲未經授權，將乙的暢銷小說翻拍成電影。下列何者最正確？", c:["翻拍屬「改作」，須經原著作財產權人（乙）同意，甲侵害改作權","翻拍是當然的合理使用","小說劇情屬思想不受保護，可自由翻拍","翻拍電影不涉及任何著作權"], a:0, e:"將小說拍成電影屬**「改作」**（就原著作另為創作），須經原著作財產權人同意，否則侵害**改作權**。注意：小說的「劇情、角色、架構」屬受保護的「表達」（非單純思想）。" },
{ id:86, t:"著作", d:2, q:"關於合理使用的四項基準，下列敘述何者最符合實務的權重觀點？", c:["四項基準權重完全相等","第四基準（對著作潛在市場與現在價值之影響）常被認為最重要，涉及是否造成市場替代","第一基準完全不重要","只需考量第二基準（著作之性質）"], a:1, e:"實務上**第四基準（市場影響）常被認為最關鍵**：若利用行為造成原著作的「市場替代」效應（消費者因此不買原著作），則難以認定合理使用。四基準須綜合判斷。" },
{ id:87, t:"著作", d:2, q:"甲將乙的新聞報導畫面「原樣重製」插入自己的節目中播出，未作任何評論或改編。就合理使用第一基準（利用之目的及性質），下列何者正確？", c:["單純重製、未作轉化之利用，較「不利」於合理使用之認定","單純重製一定構成合理使用","轉化與否與第一基準無關","只要是新聞就一定可合理使用"], a:0, e:"第一基準重視**「轉化性使用」**：若只是單純重製、未賦予新意義或目的（無轉化），較**不利**於合理使用認定。轉化性越高（如評論、諧仿）越有利。" },
{ id:88, t:"著作", d:2, q:"甲買了一本正版書，看完後拿到二手書店轉賣。下列何者正確？", c:["甲侵害出版社的散布權","依第一次銷售原則（權利耗盡），該特定重製物經合法第一次銷售後，後續轉售不再受散布權控制","二手書交易一律違法","甲須支付權利金給著作財產權人"], a:1, e:"**第一次銷售原則（權利耗盡）**：合法重製物經著作財產權人第一次銷售後，對「那一份」的散布權即耗盡，買受人可自由轉賣、贈與。否則二手書店、二手CD都將違法。" },
{ id:89, t:"著作", d:2, q:"下列何者「不」屬於著作權法第15條「推定著作人同意公開發表」的情形？", c:["著作人讓與尚未發表著作之財產權，因該財產權行使而公開發表","著作人讓與美術著作原件，受讓人以該原件公開展示","第三人未經同意擅自將著作盜版上傳網路","出資人依第12條取得財產權後，因利用而公開發表"], a:2, e:"**第三人擅自盜版上傳**是侵害行為，不是「推定同意公開發表」。第15條推定同意的情形都是基於著作人自己的處分行為（讓與財產權、讓與原件供展示等）所衍生的合理推定。" },
{ id:90, t:"著作", d:2, q:"著作權法上「語文著作」可分為語言著作與文字著作。關於即興演講（未寫成文字），下列何者最正確？", c:["即興演講（語言著作）只要具原創性，仍可能受著作權保護","語文著作只包括書面文字，演講不受保護","演講必須先寫成文字才受保護","語言著作不需原創性"], a:0, e:"**語文著作 = 語言著作 + 文字著作**。即興演講屬「語言著作」，只要具原創性，仍受著作權保護（不以附著於文字為必要）。我國採創作保護主義，著作完成即受保護。" },
{ id:91, t:"著作", d:2, q:"甲蒐集公開的電話號碼，以獨特方式分類編排成「企業電話簿」。下列何者正確？", c:["每一個電話號碼本身都受甲的著作權保護","編輯著作就「資料的選擇與編排」具原創性而受保護，但個別電話號碼本身不受保護","整份電話簿完全不受保護","甲可禁止他人撥打這些電話號碼"], a:1, e:"**編輯著作**保護的是對資料的「**選擇與編排**」所展現的原創性，而**非個別資料本身**（電話號碼是事實，不受保護）。所以他人不能照抄甲的獨特編排，但可自行蒐集相同號碼。" },
{ id:92, t:"著作", d:2, q:"關於「製版權」，下列敘述何者「錯誤」？", c:["製版權保護無著作財產權（或已消滅）之文字著述或美術著作，經製版人整理印刷後的首次重製","製版權的保護期間為10年","製版權之讓與或信託，非經登記不得對抗第三人","製版權保護的是具原創性的全新創作"], a:3, e:"錯誤在 D。**製版權正是保護「無著作權的古老著作」**（如古籍、已過保護期的美術著作）經製版人整理印刷的成果，**不是保護新創作**（新創作走一般著作權）。保護期10年，讓與/信託非經登記不得對抗第三人。" },
{ id:93, t:"著作", d:2, q:"關於我國著作權的取得，下列推論何者正確？", c:["著作完成即自動受保護（創作保護主義），著作權登記非取得權利之要件","必須向主管機關登記才取得著作權","必須通過實體審查才取得","必須公開發表後才取得"], a:0, e:"我國採**創作保護主義**：著作一經完成即自動享有著作權，**不需登記、註冊或審查**。這與商標、專利的「註冊/申請主義」截然不同。" },
{ id:94, t:"著作", d:2, q:"乙主張甲的街景照片「只是按快門」缺乏原創性。下列何者最符合實務見解？", c:["攝影只要按快門就無原創性","攝影者對拍攝主題、對象、角度、光線、時機等的選擇與安排可展現原創性，門檻雖低但仍受保護","攝影作品一律不受著作權保護","攝影須達專利的新穎性程度才受保護"], a:1, e:"實務認為攝影著作的原創性展現在攝影者的**選擇與安排**（主題、構圖、角度、光線、時機等創作判斷）。原創性門檻很低（僅須微量創意），故多數攝影作品都受保護。" },
{ id:95, t:"著作", d:2, q:"關於著作人格權與著作財產權在「讓與、繼承」上的差異，下列何者正確？", c:["人格權可讓與，財產權不可讓與","著作人格權專屬本人，不得讓與或繼承；著作財產權可全部或部分讓與、繼承","兩者都可自由讓與","兩者都不可讓與"], a:1, e:"我國近**二元論**：**人格權**（公開發表、姓名表示、禁止不當修改）**專屬著作人本身，不得讓與或繼承**；**財產權**則可全部或部分讓與、繼承。著作人死亡後其人格權仍視同存續受保護。" },
{ id:96, t:"著作", d:2, q:"下列何者「不」受著作權保護（依著作權法第9條）？", c:["法院判決書、法律條文等公文","知名作家創作的小說","具原創性的攝影作品","具原創性的編曲"], a:0, e:"**第9條排除保護**：①憲法、法律、命令、公文 ②單純傳達事實的新聞報導 ③標語及通用符號術語 ④單純數表表格 ⑤考試試題等。基於公益或不具原創性而排除。法院判決書屬「公文」，不受著作權保護。" },
{ id:97, t:"著作", d:2, q:"甲未經授權，將乙的歌曲重新編曲後在演唱會公開演唱。涉及哪些著作財產權？", c:["改作權（編曲屬改作）+ 公開演出權","僅重製權","完全不涉及著作權","僅散布權"], a:0, e:"**編曲屬「改作」→ 涉及改作權**；在演唱會演唱 → 涉及**公開演出權**。兩者都須經授權，否則構成侵害。（若另有錄音、上傳則再涉重製、公開傳輸權。）" },
{ id:98, t:"著作", d:2, q:"關於「衍生著作」（如翻譯、改編作品）的保護，下列何者正確？", c:["衍生著作不受任何保護","衍生著作以獨立著作受保護，但其保護不影響原著作之著作權；且改作須經原著作財產權人同意","衍生著作可自由改作，不需原著作權人同意","衍生著作完成後即取代原著作"], a:1, e:"**衍生著作**（翻譯、改編等）以**獨立著作**受保護，但①其保護不影響原著作的著作權 ②**改作前須經原著作財產權人同意**（否則改作行為本身即侵害改作權，縱使衍生著作有創意）。" },
{ id:99, t:"著作", d:2, q:"關於著作權的「一元論」與「二元論」，下列何者正確？", c:["一元論認為財產權與人格權各自獨立、可分離處分","二元論認為財產權與人格權各自獨立——人格權不得讓與繼承、財產權可讓與繼承；我國規定較接近二元論","我國採一元論，故人格權可隨財產權一併讓與","兩種理論的法律效果完全相同"], a:1, e:"**二元論**：財產權與人格權分立，人格權專屬本人（不得讓與/繼承）、財產權可讓與繼承——**我國規定較接近二元論**。**一元論**則視著作權為財產權與人格權結合的單一權利。兩者影響讓與、繼承與消滅的處理。" },
{ id:100, t:"著作", d:2, q:"甲在社群平台收到「侵害著作權」通知，但甲認為其利用屬合理使用。下列處理何者最正確？", c:["收到侵權通知即等同確定侵權","是否合理使用須依第65條四基準個案判斷；甲若認為未侵權，可循平台版權管理程序提出異議/撤銷聲明","合理使用無須任何判斷，一律免責","平台的通知效力等同法院確定判決"], a:1, e:"平台的通知**不等於法院判決**。是否構成侵權或合理使用，須依**第65條四基準個案判斷**。甲若認為自己屬合理使用（未侵權），可循平台版權管理功能提出異議或撤銷侵害聲明。" },

// ===== 專利進階 (101-120) =====
{ id:101, t:"專利", d:2, q:"甲發明「以特定演算法控制紅綠燈、減少交通壅塞的系統」並申請發明專利。下列判斷何者最可能正確？", c:["單純的數學演算法（抽象概念）本身不具技術性，但若結合具體技術手段解決交通問題，則可能具可專利性","任何含演算法的發明都不可專利","任何演算法都可直接取得專利","演算法屬著作權，完全不能談專利"], a:0, e:"**純粹的數學演算法/抽象概念（非利用自然法則）不可專利**，但若**結合具體的技術手段**（感測、控制硬體等）解決實際技術問題，整體可能具技術性而可專利。這是「電腦軟體/演算法可專利性」的核心判準。" },
{ id:102, t:"專利", d:2, q:"甲就「新型紙吸管的構造」申請新型專利，乙就完全相同的構造申請發明專利。關於兩者審查的差異，下列何者正確？", c:["新型採形式審查（較快、較寬鬆），發明採實體審查（較嚴格）；故新型較快取得但權利較不穩定","新型的審查比發明更嚴格","兩者審查標準完全相同","新型專利不需任何審查"], a:0, e:"**新型 = 形式審查**（只查格式形式，較快、較寬鬆，但未實質審查新穎性/進步性，**權利較不穩定**）；**發明 = 實體審查**（嚴格審查，較慢但權利穩定）。" },
{ id:103, t:"專利", d:2, q:"關於「物之發明」與「方法發明」的保護範圍，下列何者正確？", c:["若一物品有多種製造方法，僅「註冊的那個方法」受保護，故物之發明的範圍 > 方法發明","方法發明的範圍永遠大於物之發明","兩者範圍必然相同","一個發明專利不能同時包含物與方法"], a:0, e:"**物之發明範圍 > 方法發明**：物之發明保護「該物」（不論用何種方法製造）；方法發明只保護「該特定方法」。若物品有其他製法，那些製法不受方法專利拘束。一個發明專利可同時包含物與方法。" },
{ id:104, t:"專利", d:2, q:"甲聲稱發明「永動機」（不需能量輸入即可持續運轉）並申請專利。下列何者最正確？", c:["永動機違反能量/質量守恆（自然法則），實際無法製造運作，不具產業利用性，不予專利","永動機是劃時代發明，應優先給予專利","永動機應改申請新型專利","永動機應申請設計專利"], a:0, e:"**永動機違反自然法則**（能量守恆/質量守恆），實際上不可能製造運作，因此**不具產業利用性（enablement）**，不屬於可專利的發明。" },
{ id:105, t:"專利", d:2, q:"下列何者最可能取得「設計專利」？", c:["一種新的化學合成方法","手機的獨特外觀造型與圖形化使用者介面（GUI）","一條數學定理","一種純粹的商業營運模式"], a:1, e:"**設計專利保護「物品外觀的視覺設計」**（形狀、花紋、色彩）。手機外觀造型符合「物品性+視覺性」；應用於物品的**電腦圖像(icon)與GUI**也可申請設計專利。化學方法走發明、數學定理與商業模式非屬發明。" },
{ id:106, t:"專利", d:2, q:"甲利用乙的發明專利「主要技術內容」，再加以改良而完成「再發明」。甲若要實施該再發明，下列何者正確？", c:["須獲得原專利權人（乙）之授權；必要時得申請強制授權","可自由實施，不需任何授權","完全不能實施","自動取得乙的原專利權"], a:0, e:"**再發明/再新型**雖有自己的專利，但因利用了原專利的主要技術內容，**實施時須獲原專利權人授權**；若協商不成且符合法定要件，得申請**強制授權**（第87條）。" },
{ id:107, t:"專利", d:2, q:"關於「衍生設計專利」（第127條），下列敘述何者「錯誤」？", c:["同一人有二個以上近似之設計，得申請設計專利及其衍生設計專利","衍生設計之申請日，不得早於原設計之申請日","申請衍生設計專利，於原設計專利「公告後」仍得提出","同一人不得就「僅與衍生設計近似、與原設計不近似」的設計申請為衍生設計"], a:2, e:"錯誤在 C。**申請衍生設計，於原設計專利「公告後」不得為之**。其他限制：衍生設計申請日不得早於原設計；不得就僅與衍生設計近似（而與原設計不近似）者申請衍生設計。" },
{ id:108, t:"專利", d:2, q:"關於「發現」與「發明」的區別，下列何者正確？", c:["「單純發現」自然界既存的物質、現象或法則不受專利保護；「發明」是利用自然法則的技術思想創作","發現與發明完全相同","發現可專利，發明不可","兩者都不能取得專利"], a:0, e:"**單純發現**（找到自然界本就存在的物質/現象/法則，如新的礦物、既有定律）**不受專利保護**；**發明**是「利用」自然法則做出的**技術創作**（人為的技術手段），才可專利。" },
{ id:109, t:"專利", d:2, q:"下列何者「不」屬於可專利的發明（屬於「非利用自然法則」）？", c:["改良的引擎結構","一種新的西洋棋下棋規則與方法","新的藥物化合物","半導體製程"], a:1, e:"**遊戲/運動規則、心智步驟、數學方法、商業方法**屬「非利用自然法則」，不具技術性，不可專利。引擎結構、藥物化合物、半導體製程都是利用自然法則的技術創作，可專利。" },
{ id:110, t:"專利", d:2, q:"甲就「乳品製造方法」及「以該方法製成的乳製品」一併提出申請。下列何者正確？", c:["一個發明專利可同時包含「物之發明」（乳製品）與「方法發明」（製造方法）","一個申請只能擇一種類","物與方法絕不能併存於同一專利","必須拆成兩件分別申請"], a:0, e:"**一個發明專利可同時包含物之發明與方法發明**（如「乳品製造方法與乳製品」、「半導體裝置及其製造方法」）。這能同時保護產物與製程，保護更周延。" },
{ id:111, t:"專利", d:2, q:"關於三種專利的保護期間（自申請日起算），下列配對何者「錯誤」？", c:["發明專利—20年","新型專利—10年","設計專利—15年","衍生設計專利—30年"], a:3, e:"錯誤在 D。衍生設計的保護期間隨**原設計**（設計專利15年），沒有「30年」這種期間。記住：發明20、新型10、設計15。" },
{ id:112, t:"專利", d:2, q:"關於新型專利的標的限制，下列何者正確？", c:["新型專利保護物品的形狀、構造或組合，不保護氣態、液態、粉末等不具特定型態的物質或材料","新型專利可保護抽象的方法","新型專利可保護液體配方","新型專利可保護純藝術創作"], a:0, e:"**新型專利僅限「實體物品」的形狀、構造或組合**，不保護氣態/液態/粉末等不具特定型態的物質或材料（那些走發明專利），也不保護方法或藝術創作。" },
{ id:113, t:"專利", d:2, q:"設計專利的兩大特性是「物品性」與「視覺性」。下列敘述何者正確？", c:["物品性指須應用於物品外觀、供產業利用；視覺性指對視覺的具體設計，不須具備功能改良或技術手段","設計專利重視技術功能的改良","設計專利保護的是製造方法","設計專利與物品外觀無關"], a:0, e:"**物品性**：須應用於物品外觀、供產業利用（純藝術創作歸著作權）。**視覺性**：對視覺的具體設計，與技術思想無關、**不須功能改良**、不須解決技術問題——這是設計專利與發明/新型最大的不同。" },
{ id:114, t:"專利", d:2, q:"關於現代專利制度的起源與「patent」一詞，下列何者正確？", c:["起源於15世紀文藝復興時期的威尼斯；patent 源自拉丁文 patere（to be open），指國家公開賦予特權的信件","起源於羅馬帝國的鑄劍記號","patent 源自希臘神話","起源於中國宋朝的白兔商標"], a:0, e:"現代專利起源於**15世紀威尼斯**（1474年威尼斯法案是最早的成文專利法）；**patent 源自拉丁文 patere（公開）**，指「國家主權公開賦予特權的信件」(open letter)。" },
{ id:115, t:"專利", d:2, q:"美國憲法 Art. I §8 cl.8 授權國會保護專利與著作權，其背後的法理基礎是？", c:["功利主義／經濟誘因——以「限時的排他權」促進科學與實用技藝的進步","純粹的天賦人權，與經濟無關","黑格爾的人格延伸理論","國家恩給的特權，無關公益"], a:0, e:"美國憲法該條款（promote the Progress of Science and useful Arts, by securing for limited Times... the exclusive Right）體現**功利主義/經濟誘因**：用**限時**的排他權提供誘因，鼓勵發明創作，期滿後貢獻給社會。" },
{ id:116, t:"專利", d:2, q:"甲的發明「技術層次較低」，乙的「技術層次較高」。就最適合的專利類型、進步性要求與保護期間，下列何者正確？", c:["技術層次較低者較適合新型專利（10年、形式審查）；較高者適合發明專利（20年、實體審查）","技術層次低者應申請發明專利","兩者的進步性要求完全相同","新型專利要求的進步性比發明專利更高"], a:0, e:"一般而言（雖有爭議）：**新型**技術層次較低、進步性要求較低、10年、形式審查；**發明**技術層次較高、進步性要求較高、20年、實體審查。技術層次高者適合走發明專利。" },
{ id:117, t:"專利", d:2, q:"下列何者「不」屬於專利法上可保護的「發明」？", c:["利用自然法則所做出的具體技術手段","萬有引力定律本身（自然法則）","新穎的化學物質發明","新的製造方法發明"], a:1, e:"**自然法則本身**（萬有引力、慣性定律等不變真理）**不受專利保護**——它是既存的事實，非人力創作。發明必須是「利用」自然法則所做的技術創作。" },
{ id:118, t:"專利", d:2, q:"從法經濟學觀點，專利制度的核心假設與目的為何？", c:["經濟誘因能鼓勵權利人投入發明；以限時獨占讓發明人回收高額研發成本，並於期滿後使技術進入公共領域","發明人不在乎成本，專利純屬形式","沒有專利制度時發明會更多","專利制度與經濟誘因無關"], a:0, e:"法經濟學觀點：研發成本高昂，若無保護、成本無法回收，發明人將缺乏誘因。**專利以限時獨占提供經濟誘因**（讓發明人回收成本+獲利），換取技術公開、期滿後貢獻社會（理論上能降低成本、提高發明數量）。" },
{ id:119, t:"專利", d:2, q:"甲有一項製造技術，正考慮申請專利或以營業秘密保護。下列策略分析何者最正確？", c:["專利須「公開」技術以換取20年獨占；若選擇不公開可改用營業秘密（無固定期限，但無法排除他人合法的獨立研發或還原工程）","申請專利完全不需公開技術","營業秘密在所有情況下都優於專利","兩種保護方式完全相同，可任意互換"], a:0, e:"**關鍵權衡**：專利=公開技術換取**限時(20年)獨占權**，但期滿即進入公共領域；營業秘密=**保密**換取**無期限**保護，但**無法防止他人獨立研發或合法還原工程**。技術易被逆向破解者宜申請專利，難破解者可考慮營業秘密（如可口可樂配方）。" },
{ id:120, t:"專利", d:2, q:"「商業方法」（如一種新的線上交易流程）可否取得發明專利？下列分析何者最正確？", c:["純粹的商業方法（非利用自然法則）原則上不具技術性而不可專利；但若結合具體技術手段實現，可能具可專利性","商業方法一律可以取得發明專利","商業方法一律不可專利，且應改用著作權保護","商業方法屬於商標保護的範圍"], a:0, e:"**純商業方法（經驗法則、抽象的營運流程）非利用自然法則，原則上不具技術性、不可專利**；但若該商業方法**結合具體的技術手段**（系統架構、技術元件）來實現，整體可能具技術性而具可專利性。" },

// ===== 營業秘密進階 (121-140) =====
{ id:121, t:"營業秘密", d:2, q:"甲公司的「客戶名單」包含客戶喜好、特殊需求、內部決策聯絡人，且經整理分析。乙員工離職時帶走。依智財法院107民營訴2見解，下列何者最正確？", c:["經整理分析、含客戶喜好與特殊需求等的名單，較可能具秘密性及經濟價值而受保護","任何形式的客戶名單都不可能受保護","所有客戶名單都當然是營業秘密","名單內容與是否受保護無關"], a:0, e:"依107民營訴2：**僅有名稱、地址、聯絡方式且可輕易查得的名單，難認有秘密性**；但若含「客戶喜好、特殊需求、相關背景、內部聯絡及決策名單」等**經整理分析**的資訊，則較可能具秘密性與經濟價值而受保護。" },
{ id:122, t:"營業秘密", d:2, q:"甲主張其「商品交易價格資訊」為營業秘密。依107民營訴2見解，下列何者最正確？", c:["市場價格非一成不變，若無「以競爭對手報價為基礎搶單」等違反產業倫理的特殊因素，單純的價格資訊難認具經濟價值","所有商品價格資訊都是營業秘密","價格資訊必然具有經濟價值","價格資訊不需要任何保密措施即受保護"], a:0, e:"法院認為：市場價格本就會變動，銷售價格與成本利潤等經營策略有關。若無「以競爭對手報價為基礎、同時報較低價搶單」等違反產業倫理的特殊因素介入，**單純曾接觸的價格資訊難認具經濟價值**。" },
{ id:123, t:"營業秘密", d:2, q:"乙以「還原工程」（reverse engineering）拆解分析甲合法販售的產品，因而得知其技術秘密。下列何者正確？", c:["還原工程原則上屬正當方法，乙未侵害甲的營業秘密","還原工程屬於竊盜","還原工程一律違法","乙因此須對甲負損害賠償責任"], a:0, e:"**還原工程原則上屬正當方法**：合法取得產品後自行拆解分析所得，並不違法。這也說明營業秘密保護不了「能被合法逆向破解的技術」——這正是與專利保護的重要差異。" },
{ id:124, t:"營業秘密", d:2, q:"甲公司主張已對某資料採取合理保密措施，但實際上僅在「開會後將文件收回」。依高院97勞上易28見解，下列何者最正確？", c:["僅開會後收回、無其他明確保密作為，難認已採取合理保密措施，故不符營業秘密要件","收回文件即構成充分的合理保密措施","營業秘密不需要任何保密措施","收回文件等同於檔案加密"], a:0, e:"法院認為：**僅「開會後收回」、無明確的保密作為**，難認已將資料作為機密而採取保護措施。合理保密措施須有具體作為（標示密等、門禁、加密、分級授權等），不能只是形式上收回。" },
{ id:125, t:"營業秘密", d:2, q:"關於「保密契約」約定的「機密資料」與營業秘密法定義的「營業秘密」，下列何者正確（依高院97勞上易28）？", c:["契約約定的保密範圍不必與營業秘密法定義完全一致，但仍須具明確性、合理性，且至少須具非周知性並有保密措施","契約可將公司任何資訊都列為機密，且絕對有效","契約用「包括但不限於」即可無限擴張保密範圍","保密契約一律無效"], a:0, e:"基於契約自由，保密契約的「機密資料」**不必與營業秘密法定義完全一致**，但**仍須具明確性、合理性**；且縱使非法定營業秘密，**至少須具非周知性並有保密措施**。「包括但不限於」不得擴張解為任何資訊都受保密拘束。" },
{ id:126, t:"營業秘密", d:2, q:"甲意圖在「中國大陸」使用，而竊取台灣公司的營業秘密。依營業秘密法第13條之2，其刑責相較於境內使用如何？", c:["域外使用（外國、大陸、港澳）刑責加重為1年以上10年以下有期徒刑，罰金300萬~5000萬元","域外使用與境內使用的刑責完全相同","域外使用不罰","只負民事責任，無刑責"], a:0, e:"**第13條之2（域外加重）**：意圖在外國、大陸、港澳使用而犯罪者，加重為**1年以上10年以下徒刑、罰金300萬~5000萬**（一般境內第13條之1為5年以下、100萬~1000萬）。反映保護國家關鍵技術的政策。" },
{ id:127, t:"營業秘密", d:2, q:"關於營業秘密「損害賠償請求權」的時效（第12條），下列何者正確？", c:["自請求權人知有行為及賠償義務人時起「2年」不行使而消滅；自行為時起逾「10年」者亦同","永久可以請求，無時效限制","自知悉時起10年","自知悉時起50年"], a:0, e:"**第12條雙重時效**：①短期——自「知有行為及賠償義務人時起**2年**」②長期——自「行為時起逾**10年**」。任一屆滿，損害賠償請求權即消滅。" },
{ id:128, t:"營業秘密", d:2, q:"下列何者「不」屬於營業秘密法第10條所稱的「不正當方法」？", c:["詐欺","引誘他人違反其保密義務","合法購買產品後進行還原工程","擅自重製"], a:2, e:"第10條「不正當方法」例示：竊盜、詐欺、脅迫、賄賂、擅自重製、違反保密義務、引誘他人違反保密義務或其他類似方法。**還原工程（原則上正當）不在內**。" },
{ id:129, t:"營業秘密", d:2, q:"關於我國營業秘密「秘密性」採「業界標準」（同 TRIPS 39(2)）的意義，下列何者正確？", c:["只要「非一般涉及該類資訊的業界人士所知」即具秘密性，不以一般民眾不知為準","必須一般民眾都不知道才算秘密","必須全世界都不知道才算秘密","與業界是否知悉無關"], a:0, e:"我國/TRIPS 採**業界標準**：只要「**非一般涉及該類資訊之業界人士所知**」即具秘密性。對照日本、美國的**公眾標準**（看一般民眾是否知悉）。業界標準的門檻通常較嚴（業界人士可能知道但一般民眾不知）。" },
{ id:130, t:"營業秘密", d:2, q:"由「公眾已知資訊」所構成的「組合」，可否成為營業秘密（Imperial Chemical 案）？", c:["各個別特徵雖在公共領域，但若以獨特方式組合而具競爭優勢，其整體獨特組合仍可能受保護","公眾資訊的組合一律不可能成為營業秘密","必須每個元素都是秘密才行","組合與是否為營業秘密無關"], a:0, e:"依 Imperial Chemical 案：**營業秘密可存在於「特徵與元件的組合」中**——即使每個元件單獨來看都在公共領域，但其統一的製程、設計與運作方式的**獨特組合**若帶來競爭優勢，仍可能是受保護的秘密。" },
{ id:131, t:"營業秘密", d:2, q:"競業禁止的「約定」依勞基法第9條之1，若雇主「未對勞工因不從事競業所受損失給予合理補償」，其效果為何？", c:["違反第9條之1第1項各款要件之一，該競業禁止約定無效","約定仍然有效","補償可以離職後再補","不影響約定的效力"], a:0, e:"勞基法第9條之1四要件之一即「**雇主對勞工不從事競業所受損失有合理補償**」。**違反四要件之任一者，競業禁止約定無效**（第3項）。合理補償是約定有效的關鍵門檻。" },
{ id:132, t:"營業秘密", d:2, q:"關於勞基法第9條之1的「合理補償」，下列何者正確？", c:["合理補償「不包括」勞工於工作期間所受領的給付（在職薪資不能充當補償）","在職期間的薪資可以充當競業禁止的補償","不需要任何補償","補償金額沒有任何限制且無關效力"], a:0, e:"第9條之1第2項明定：**合理補償「不包括」勞工於工作期間所受領的給付**。也就是說，雇主不能拿「在職薪資」當作競業禁止的補償，必須是離職後另外的補償。" },
{ id:133, t:"營業秘密", d:2, q:"關於離職後競業禁止的期間限制，下列何者正確？", c:["最長不得逾2年，逾2年者縮短為2年","最長5年","完全無期間限制","最長10年"], a:0, e:"**離職後競業禁止最長2年**（勞基法第9條之1第4項），**逾2年者縮短為2年**。這是對勞工工作權的保護，避免過度限制離職後的就業。" },
{ id:134, t:"營業秘密", d:2, q:"民法第562條、公司法第32條規定的「法定競業禁止」，主要規範的對象是？", c:["經理人、代辦商","公司所有的基層員工","清潔工與工讀生","僅限於股東"], a:0, e:"**法定競業禁止**主要針對**經理人、代辦商**：民法562/563（經理人/代辦商非經商號允許不得經營同類事業）、公司法32/34（經理人不得兼任他營利事業經理人或自營同類業務）。一般員工的競業禁止須靠「約定」（勞基法9-1）。" },
{ id:135, t:"營業秘密", d:2, q:"保護營業秘密的「反不正競爭理論」，其受到的主要批評是？", c:["侵害人的目的可能並非為競爭（如單純竊取轉售牟取財產價值），未必都涉及破壞競爭秩序","反不正競爭理論毫無缺點","該理論與市場競爭完全無關","反不正競爭理論不保護社會利益"], a:0, e:"**反不正競爭理論**（我國第1條「維護產業倫理與競爭秩序」）的批評：侵害人的目的**未必是競爭**——例如單純竊取營業秘密轉售牟取財產價值，對侵害人本身而言目的非競爭，難以全用「競爭秩序」解釋（故多數國家併採財產理論）。" },
{ id:136, t:"營業秘密", d:2, q:"關於「合理保密措施」的判斷，下列何者正確？", c:["採「需知原則」(need-to-know)，與知悉人數多寡無關，須視營業秘密種類、實際經營情形及業界一般預防措施而定","知悉的人越多代表保密措施越好","必須做到「零人知悉」才算合理","與業界一般標準完全無關"], a:0, e:"**合理保密措施採「需知原則」(need-to-know)**：只讓有需要的人知道。**與知悉人數無關**（業務上必要的多人知悉仍可），須綜合考量營業秘密種類、實際經營情形、行業一般預防措施（如標示密等、門禁、分級授權、加密、離職規定）。" },
{ id:137, t:"營業秘密", d:2, q:"營業秘密遭侵害時的「不作為請求權」（第11條），權利人可請求什麼？", c:["請求排除現有侵害、防止侵害之虞，並得請求銷燬侵害行為作成之物或專供侵害所用之物","只能請求金錢損害賠償","只能向警方報案","沒有任何救濟手段"], a:0, e:"**第11條不作為請求權**：①受侵害時得請求**排除** ②有侵害之虞者得請求**防止** ③並得對侵害行為作成之物或專供侵害所用之物請求**銷燬**或其他必要處置。這是事前/事中的預防性救濟。" },
{ id:138, t:"營業秘密", d:2, q:"乙取得某營業秘密，「因重大過失而不知」其為他人以不正當方法取得者，仍加以使用。依第10條，下列何者正確？", c:["因重大過失而不知，仍取得、使用或洩漏者，亦構成營業秘密侵害","只要不知情就一律免責","只有「故意」才構成侵害，過失不算","重大過失不屬於侵害態樣"], a:0, e:"第10條侵害態樣包含：「**知悉或因重大過失而不知**其為以不正方法取得之營業秘密，而取得、使用或洩漏者」。換言之，**重大過失**而不知者**仍構成侵害**（並非只罰故意）。" },
{ id:139, t:"營業秘密", d:2, q:"關於營業秘密的保護期間，下列何者正確？", c:["至該營業秘密「公開」為止——只要持續維持秘密性，即可無限期受保護","固定保護20年","保護至著作人死後50年","保護10年且可延展"], a:0, e:"**營業秘密無固定保護期間，至秘密「公開」為止**：只要持續維持其秘密性，就能無限期受保護（如可口可樂配方逾百年）。但一旦公開（被合法揭露、還原工程破解等），即失去保護。" },
{ id:140, t:"營業秘密", d:2, q:"關於羅馬法「actio servi corrupti」（腐化奴隸之訴）是否為現代營業秘密法的直接起源，學說有爭議。下列何者最符合 Alan Watson 的觀點？", c:["Watson 認為 Schiller 的主張缺乏證據：該訴訟「可能」用於保護商業利益，但沒有任何證據顯示曾被如此使用","Watson 確認它就是營業秘密法的直接起源","Watson 認為它與商業利益完全無關","Watson 認為它是專利法的起源"], a:0, e:"Alan Watson 批評 Schiller：actio servi corrupti「**可能**」被用於保護商業秘密等利益，但這**不是它的目的，且沒有絲毫證據顯示曾被如此使用**。許多私法訴訟（竊盜、財產損害等）理論上也都「可能」如此用，但無證據。故將其視為現代營業秘密法的對應物是牽強的。" },

// ===== 綜合進階 (141-160) =====
{ id:141, t:"綜合", d:2, q:"甲設計了一款造型獨特的椅子。關於可能的多重智慧財產保護，下列何者「錯誤」？", c:["椅子的造型可申請設計專利","若造型具原創性，可能受著作權保護為美術著作","若造型取得識別性，可能註冊為立體商標","椅子的造型必須先「註冊為營業秘密」才受保護"], a:3, e:"錯誤在 D——**營業秘密不需註冊，且核心是「保密」**，公開販售的椅子造型無法當營業秘密。但椅子造型可同時受**設計專利、著作權（美術著作）、立體商標**保護（一物多權）。" },
{ id:142, t:"綜合", d:2, q:"比較四大智慧財產權的「取得方式」，下列配對何者「錯誤」？", c:["著作權—創作完成即自動取得","商標—申請註冊","專利—申請並經審查","營業秘密—向主管機關申請註冊"], a:3, e:"錯誤在 D。**營業秘密「不需註冊」**（註冊反而會公開，違背保密本質），只要符合三要件並維持保密即受保護。著作權採創作保護主義（自動）；商標、專利採申請/註冊主義。" },
{ id:143, t:"綜合", d:2, q:"甲開發了一套核心「演算法」，想全方位保護。下列策略分析何者最完整？", c:["演算法若結合技術手段可能申請發明專利（公開、20年）；或以營業秘密保護（保密、無期限但防不了還原工程）；其「原始碼的表達」則受著作權保護","演算法只能用商標保護","演算法完全無法受任何智慧財產權保護","演算法只能用著作權，不可能用其他方式"], a:0, e:"**同一演算法可有多重保護策略**：①結合技術手段→**發明專利**（公開換20年獨占）②保密→**營業秘密**（無期限但防不了獨立研發/還原工程）③原始碼的「文字表達」→**著作權**（保護表達，不保護演算法的思想本身）。" },
{ id:144, t:"綜合", d:2, q:"下列關於四大智慧財產權「立法目的關鍵字」的配對，何者「錯誤」？", c:["商標—維護市場公平競爭、保障消費者利益","著作權—促進國家文化發展","專利—促進產業發展","營業秘密—促進國家文化發展"], a:3, e:"錯誤在 D。**營業秘密法第1條的核心是「維護產業倫理與競爭秩序、調和社會公共利益」**，不是「促進國家文化發展」（那是著作權法的目的）。記法：文化→著作；產業→專利；倫理競爭→營業秘密；公平競爭消費者→商標。" },
{ id:145, t:"綜合", d:2, q:"三大智慧財產保護原理中，洛克(Locke)勞動理論的核心主張是？", c:["勞動理論（labor-desert）——人對自己付出勞動所創造的成果享有財產權","財產是人格的延伸與自由的體現","以經濟誘因促進創新","財產源於國家的恩給特權"], a:0, e:"**洛克（Two Treatises of Government）**：人對自己的人身有所有權，將勞動「混合」於自然物上，即取得對該物的財產權（labor-desert，天賦權利/Natural Rights）。批評：商標未必都是權利人勞動設計的成果。" },
{ id:146, t:"綜合", d:2, q:"黑格爾(Hegel)的「人格理論」(Personhood) 對智慧財產的主張是？", c:["財產是權利人人格的延伸與自由的體現，是發展人格的要素","勞動創造財產","以經濟誘因鼓勵創新","財產純粹源自國家授予"], a:0, e:"**黑格爾（Philosophy of Right）人格理論**：財產是「自由的體現」、是人格的延伸（property is the embodiment of freedom）。某些商標/著作確與權利人的人格、商業活動密切相關，體現此理論。" },
{ id:147, t:"綜合", d:2, q:"甲離職後到競爭對手公司任職，並使用前公司的營業秘密。前公司可能同時主張哪些責任？", c:["營業秘密侵害（營業秘密法）+ 違反競業禁止約定（契約/勞基法）","只能主張其中一種，不得併存","只能主張著作權侵害","無法主張任何責任"], a:0, e:"兩者**可能併存**：①使用營業秘密→**營業秘密法**的民/刑事責任 ②若簽有有效的競業禁止約定→**違反競業禁止的契約責任**（勞基法9-1）。兩者法源、要件不同，可同時主張。" },
{ id:148, t:"綜合", d:2, q:"關於各智慧財產權保護期間「屆滿後」的狀態，下列何者正確？", c:["專利、著作權屆滿後進入公共領域，人人可自由利用；商標可不斷延展；營業秘密一旦公開即失去保護","所有智慧財產權都永久保護","屆滿後仍繼續受保護","著作權屆滿後可再申請延展"], a:0, e:"**屆滿後狀態**：①專利（20/10/15年）、著作權（死後50年）屆滿→**進入公共領域**，人人可用 ②商標→可不斷**延展**而長久存續 ③營業秘密→**一旦公開即失保護**（無固定期間）。" },
{ id:149, t:"綜合", d:2, q:"同一個「品牌標誌設計圖」，關於商標權與著作權的併存，下列何者正確？", c:["該設計圖可能同時是著作權保護的「美術著作」與註冊後的「商標」；兩者保護重點不同（原創性 vs 識別性），可併存","只能擇一保護，不能併存","取得商標權後著作權即消滅","兩種權利互相排斥"], a:0, e:"**可併存**：一個 logo 既可能是具原創性的**美術著作**（著作權，自動取得、死後50年），也可能註冊為**商標**（識別性，註冊取得、可延展）。兩者保護要件與重點不同（原創性 vs 識別性），可同時存在。" },
{ id:150, t:"綜合", d:2, q:"比較「專利新穎性」與「著作權原創性」對「兩人各自獨立創作出雷同成果」的處理，下列何者正確？", c:["著作權保護各自獨立創作的雷同作品（都受保護）；專利只給「最先申請」者（後發明者即使獨立完成也無法取得）","兩者都保護獨立創作的雷同成果","兩者都只給最先申請/創作者","兩者的處理方式完全相同"], a:0, e:"**關鍵差異**：①著作權原創性只要「獨立創作」→兩人雷同作品**都受保護** ②專利新穎性要求「世界首創」+ 先申請主義→**只給最先申請者**，後者縱使獨立發明也不行。這凸顯兩種權利本質的不同。" },
{ id:151, t:"綜合", d:2, q:"下列關於四大智慧財產權「是否需要註冊/申請」的配對，何者全部正確？", c:["專利(需)、商標(需)、著作權(不需)、營業秘密(不需)","四者全部都需要註冊","四者全部都不需要註冊","著作權需要、營業秘密需要註冊"], a:0, e:"**正確配對**：專利（申請+審查）、商標（申請註冊）**需要**；著作權（創作保護主義，自動取得）、營業秘密（保密即可，註冊反而違背本質）**不需要**。" },
{ id:152, t:"綜合", d:2, q:"甲員工簽了競業禁止條款，但雇主既無應受保護的營業秘密、也未給予任何補償。下列何者最正確？", c:["違反勞基法第9條之1的要件（無正當營業利益、無合理補償），該競業禁止約定無效","約定完全有效，甲須遵守","約定部分有效","須等法院個案判決才能知道是否有效，學理上無法判斷"], a:0, e:"勞基法第9條之1要求雇主須有「**正當營業利益**」且給予「**合理補償**」等四要件，**違反任一者約定即無效**。本題雇主同時欠缺正當營業利益與補償，競業禁止約定**無效**。" },
{ id:153, t:"綜合", d:2, q:"關於「功利主義/經濟誘因」理論在各智慧財產權的體現，下列何者正確？", c:["專利與著作權以「限時的排他權」提供經濟誘因，鼓勵發明與創作，期滿後使成果進入公共領域","功利主義主張對所有智慧財產給予永久保護","功利主義理論與經濟誘因無關","功利主義只適用於商標權"], a:0, e:"**功利主義/經濟誘因**：用「**限時**排他權」提供誘因（讓創作/發明人能回收成本、獲利），鼓勵投入創新；期滿後成果**進入公共領域**供社會使用。專利、著作權最能體現此「限時」的設計。" },

{ id:"商標", title:"商標法重點整理", weight:"35%", body:`
## 〇、商標是什麼？三大功能
**商標(trademark)**：用來指示及區別商品/服務「來源」的標識。
- **來源識別功能(origin identifier)**：核心功能。讓消費者知道「這是誰家的東西」。
- **品質擔保功能(quality guarantee)**：同一商標下的商品品質應一致，消費者才能信賴。
- **廣告功能(advertising)**：商標累積商譽(goodwill)，本身成為行銷資產。

> **商譽(goodwill)**：商標長期使用累積的信譽與顧客好感，是商標保護的核心價值。

## 一、識別性光譜（最重要，必考！）
**識別性(distinctiveness)**：商標讓消費者「指認並區別來源」的能力。是商標能否註冊的核心。

| 類型 | 英文 | 定義 | 例子 | 可否註冊 |
|---|---|---|---|---|
| 通用名稱 | generic | 商品/服務的「通用稱呼」本身 | 「鹽」賣鹽、「電腦」賣電腦 | **絕對不可**（即使有第二意義也不行）|
| 描述性 | descriptive | 直接描述商品的品質、功用、成分、產地等 | 「燒烤」開烤肉店 | 原則不可，**取得第二意義才可** |
| 暗示性 | suggestive | 用「譬喻、暗示」間接點出特性，需消費者運用想像力 | Netflix、Microsoft、靠得住 | **可** |
| 任意性 | arbitrary | 是既有詞彙，但與指定商品「無關」 | Apple 賣電腦、黑松 | **可** |
| 獨創性／創造性 | fanciful/coined | 憑空創造、本無意義的字 | Acer、Sony、Kodak、Häagen-Dazs | **可（識別性最強）** |

> **記憶口訣：通(用) → 描(述) → 暗(示) → 任(意) → 獨(創)**。越往右識別性越強、保護越強。

**關鍵區辨：描述性 vs 暗示性** → 看「需不需要想像力」這道橋。
- 描述性 = 一看就懂、直接說明（不需想像）
- 暗示性 = 要動點腦筋、聯想才懂（需想像）

## 二、第二意義（後天識別性）
**第二意義(secondary meaning) / 後天識別性(acquired distinctiveness)**：原本不具先天識別性的標識（描述性、顏色、形狀等），經長期大量使用後，使消費者「一看到就想到特定來源」，因而取得識別性。
- 例：De Beers「鑽石恆久遠 一顆永流傳」、Louboutin 紅色鞋底、「明通治痛單」。
- 判斷因素：使用時間、銷售量、廣告量、市場調查、媒體報導等。

## 三、可保護的商標客體（第18條）
**傳統商標**：文字、圖形、記號。
**非傳統商標**：
- **顏色商標**：單一或組合顏色（需第二意義，如 Tiffany 藍）。
- **立體商標(3D mark)**：商品本身、包裝容器的立體形狀（如可口可樂曲線瓶）。
- **動態商標(motion mark)**：影像動態變化的整體商業印象。
- **全像圖商標(hologram)**：利用全像術隨角度變化的立體影像。
- **聲音商標(sound mark)**：如綠油精廣告音、Intel 五音。
> 我國第18條以「等」字保留彈性，但**氣味、味道**商標因難以「明確、客觀」表示，實務上難註冊。

**功能性(functionality)**：若標識是商品「為達成技術功能所必須」的特徵，**不得**由一人獨占（否則妨礙公平競爭）。112年修法：功能性部分未以**虛線**呈現（排除於專用範圍）者不得註冊。

## 四、三大基本原則
- **註冊保護主義**：須申請「註冊」才取得商標權（我國）。對照**使用主義**（美國，use in commerce，使用即生權利）。
- **屬地主義(territoriality)**：商標權於各國「效力獨立」，在台灣註冊不當然及於外國。
- **先申請先註冊主義(first-to-file)**：相同/近似商標用於同一/類似商品，准最先申請者；同日申請無法辨別先後 → **協議**不成 → **抽籤**（第22條）。

## 五、商標 vs 各種標章
| 類型 | 功能 | 重點 |
|---|---|---|
| 商標 | 指示自己商品/服務來源 | 權利人自己使用 |
| **證明標章** | 證明商品/服務的「特性、品質、產地」等 | 申請人**不得自營**該業務（避免球員兼裁判）|
| **團體標章** | 表彰「會員的會籍」 | 非商業性（如獅子會徽）|
| **團體商標** | 指示「會員所提供商品/服務」來源 | 由團體會員共同使用 |

**產地證明標章 vs 產地團體商標**：
- 產地證明標章 = **開放式**（符合規範條件者皆可用，申請人不能自用），如「池上米」。
- 產地團體商標 = **封閉式**（僅限會員使用）。
- **地理標示(geographical indication, GI)**：TRIPS 要求保護的「產地來源標示」；即使未註冊，仍可依第30條第1項第8、9款排除他人搶註。

## 六、註冊的消極要件（不得註冊事由，第29、30條）
- **第29條**（欠缺識別性）：通用名稱、描述性而未取得第二意義者。
- **第30條**（其他不得註冊）重點款項：
  - 妨害公共秩序或善良風俗
  - 與**他人先註冊商標**近似而有混淆誤認之虞（第10款）
  - 與**著名商標**近似有混淆誤認、或有減損識別性/信譽之虞（第11款，著名商標保護＋**商標淡化**）
  - 含他人**著名姓名、藝名、肖像**未經同意（第13款）
  - 功能性（第4項）

**聲明不專用(disclaimer)**：商標含「不具識別性」的部分時，聲明對該部分不主張專用權，使整體商標仍可註冊。注意：聲明的部分在判斷混淆誤認時仍可能納入整體觀察。

## 七、商標權範圍與「商標之使用」
**商標之使用(第5條)**：為行銷目的，將商標用於商品、包裝、廣告等，足以使消費者認識其為商標。
- 重點：要「**作為商標使用**」（指示來源）才算，單純裝飾或描述不算。

## 八、混淆誤認之虞 八要素（最重要！）
**混淆誤認之虞(likelihood of confusion)**：消費者可能誤認商品來源相同，或誤認兩者間有關係企業、授權等關聯。
八項參酌因素：
1. **商標近似程度**（外觀、讀音、觀念）
2. **商品/服務類似程度**
3. **識別性強弱**（識別性越強，越易致混淆 → 與混淆「成正比」）
4. 先權利人**多角化經營**情形
5. **實際混淆**之情事
6. 相關消費者對各商標**熟悉程度**
7. 申請是否**善意**
8. 其他混淆因素

> **近似判斷原則**：①**整體觀察**（不割裂看）②**異時異地、隔離觀察**（消費者憑模糊印象在不同時地選購，不會並列細看）③**通體觀察**綜合外觀、讀音、觀念。

## 九、著名商標與商標淡化
- **著名商標(well-known mark)**：相關事業或消費者「廣為知悉」的商標。著名商標**未註冊也受保護**，且可**跨類保護**。
- **商標淡化(dilution)**：僅保護著名商標、**不以混淆誤認為要件**。要求的近似程度比一般混淆「更高」。兩種：
  - **減損識別性之虞(blurring 沖淡)**：使著名商標的獨特指向被沖淡（如「Hugo Boss」被他人用在無關商品）。
  - **減損信譽之虞(tarnishment 玷污)**：使著名商標與負面、低劣形象連結。

## 十、合理使用（商標權的限制，第36條）
- **描述性合理使用**：以善意、符合商業習慣的方式，用文字描述「自己商品」的名稱、品質、產地等（縱與他人商標相同）。
- **指示性合理使用**：為「指示他人的商品/服務」而使用其商標（如維修廠標示可修哪些品牌、標示相容耗材）。

## 十一、權利耗盡與平行輸入
**權利耗盡(exhaustion)／首次銷售原則**：附有商標的真品經商標權人或其同意而第一次流通後，權利人不能再控制後續轉售。
**真品平行輸入(parallel import)**：未經代理商，逕自從外國輸入「真品」（水貨）。我國採**國際耗盡**原則，平行輸入真品原則上**不構成**商標侵害（但不得有積極促使誤認、改造商品等情形）。

## 十二、侵害與救濟
- 民事：排除/防止侵害、損害賠償、銷毀侵害物。
- 刑事：第95條以下（侵害商標權罪、販賣仿冒品罪等）。
- 與**公平交易法**併用：補充規範表徵仿冒、攀附商譽、搭便車等不公平競爭。

## 十三、保護期間
**自註冊公告日起10年**，期滿可**不斷申請延展**（每次10年）→ 商標是唯一可「永續」存在的智慧財產權（只要持續使用＋延展，如黑松1951至今）。

## 〇、著作權保護什麼？
**著作(work)**：屬於文學、科學、藝術或其他學術範圍之**創作**。著作權保護的是「具原創性的表達」。
**創作保護主義**：著作一經「完成」即**自動**取得著作權，**不需登記、註冊或審查**（與商標、專利的申請主義相反）。著作權登記制已廢止，登記非權利取得要件。

## 一、保護要件：原創性
**原創性(originality)** = **原始性(獨立創作)** + **創作性(最低程度創意)**。
- **獨立創作**：自己獨立完成，非抄襲他人。
- **最低創意**：只要有一點點精神作用、個性展現即可，**門檻很低**。
- 與**專利新穎性(novelty)**天差地別：專利要「世界首創」；著作權則「兩人各自獨立畫出相似的畫，都受保護」。

## 二、思想與表達二分法（第10條之1，必考！）
> 「依本法取得之著作權，其保護僅及於該著作之**表達**，而不及於其所表達之**思想、程序、製程、系統、操作方法、概念、原理、發現**。」

**思想表達二分法(idea-expression dichotomy)**：著作權只保護「表達(expression)」，不保護「思想(idea)」。
- 受保護的「**表達**」：文字遣詞、劇情鋪陳、故事架構、角色刻畫與外型、整體觀感(look and feel)。
- 不受保護的「**思想**」：抽象概念、數學公式、科學原理、操作方法、遊戲規則。
- **合併原則(merger doctrine)**：當某思想「只有一種或極少數表達方式」時，表達與思想合併，為避免獨占思想，該表達也不受保護。
- 典故：Baker v. Selden（會計簿記表格案）——書中「方法」不受著作權保護。

## 三、著作人格權 vs 著作財產權（核心區分！）
**著作人格權(moral rights)** — 關乎著作人的「名譽、人格」，**專屬本人，不得讓與或繼承**：
1. **公開發表權**：決定著作是否、何時、如何公開發表。
2. **姓名表示權**：決定具名、別名或不具名。
3. **禁止不當修改權（同一性保持權）**：禁止他人以歪曲、割裂、竄改方式損害著作人名譽。
> 著作人死亡後，其著作人格權仍「視同生存」受保護。

**著作財產權(economic rights)** — 關乎「經濟利用」，**可全部或部分讓與、授權、繼承**：
- **重製權**：印刷、複印、錄音、錄影、數位重製等。
- **公開口述權**（語文著作）、**公開播送權**（廣播電視）、**公開上映權**（影片）、**公開演出權**（現場表演）、**公開傳輸權**（網路）、**公開展示權**（未發表的美術/攝影原件）。
- **改作權**、**編輯權**、**散布權**、**出租權**、**輸入權**。

> **一元論 vs 二元論**：
> - **二元論**：人格權、財產權分立（人格權不得讓與繼承；財產權可）→ **我國較接近二元論**。
> - **一元論**：兩者結合為單一不可分的權利（德國）。

## 四、重要的財產權態樣
- **改作(adaptation)**：以「翻譯、編曲、改寫、拍攝影片或其他方法」就原著作「另為創作」。需經原著作財產權人同意（改作權），否則侵權。
- **衍生著作(derivative work)**：改作完成的新著作（如翻譯本、電影版）。以**獨立著作**受保護，但①不影響原著作之著作權 ②改作前須經授權。
- **編輯著作(compilation)**：就資料的「**選擇與編排**」具原創性者，以獨立著作保護（保護編排巧思，不保護個別資料）。
- **散布權 + 第一次銷售原則(first sale doctrine／權利耗盡)**：合法重製物第一次銷售後，買受人可自由轉賣、贈與（如二手書店合法）。

## 五、合理使用（最重要！第65條四基準）
**合理使用(fair use)**：在一定條件下，未經授權利用他人著作而不構成侵害。判斷四基準：
1. **利用之目的及性質**：商業 or 非營利教育？是否為**轉化性使用(transformative use)**（賦予新意義、目的，如評論、諧仿）？
2. **著作之性質**：事實性著作的合理使用空間 > 高度創作性著作。
3. **所利用之質量及比例**：利用的「量」與「質（是否為核心精華）」。
4. **對著作潛在市場與現在價值之影響**：是否造成**市場替代(market substitution)**？→ **常被認為最重要**的基準。

## 六、權利歸屬（職務 vs 出資）
| 情形 | 著作人 | 著作財產權（未約定時）|
|---|---|---|
| **職務著作（第11條，受雇關係）** | 受雇人 | **歸雇用人** |
| **出資聘人（第12條，承攬/委任）** | **受聘人** | 歸受聘人，但**出資人得利用** |

> 記法：受「雇」→ 老闆(雇用人)拿財產權；「出資」聘人 → 創作的受聘人拿，出資人只能「利用」。

## 七、不受著作權保護者（第9條）
①憲法、法律、命令、公文 ②單純為傳達事實之新聞報導所作的語文著作 ③標語及通用之符號、名詞、公式、數表、表格、簿冊或時曆 ④依法令舉行之各類考試試題及備用試題。
> 理由：基於公益（人人需用）或不具原創性。

## 八、製版權（特殊的鄰接權）
**製版權(plate right)**：將「無著作財產權或其財產權消滅」之文字著述或美術著作，經製版人**整理、印刷、首次發行**並依法登記者，取得就該版面「以影印、印刷或類似方式重製」的權利。
- 保護期間：**10年**。
- 目的：鼓勵整理出版古籍、古畫（保護的是「排版印刷的心力」，不是新創作）。

## 九、著作鄰接權概念
**表演(performance)**：對既有著作的表演（如演唱、演奏、演戲），以獨立著作保護。
**錄音著作**：聲音首次固定的成果。一首歌常涉及：詞曲（音樂著作）＋ 錄音（錄音著作）＋ 表演 ＋（藝名/標誌可能是商標），授權時須處理多方權利。

## 十、保護期間
- 原則：**著作人生存期間 + 死亡後50年**（第30條）。注意我國是**死後50年**（非美國70年）。
- 別名/不具名、法人著作、攝影/視聽/錄音/表演：**公開發表後50年**。
- 期間屆滿 → 進入**公共領域(public domain)**，人人可自由利用。

{ id:"專利", title:"專利法重點整理", weight:"10%", body:`
## 〇、專利制度的本質
**專利(patent)**：國家為鼓勵發明、促進產業發展，授予發明人「**限時的排他權**」，以換取技術的「**公開**」。期滿後技術進入公共領域。
- **patent 字源**：拉丁文 patere（to be open，公開），原指君主公開賦予特權的信件。
- 起源：**15世紀威尼斯**（1474年威尼斯法案，最早成文專利法）。
- 法理：**功利主義/經濟誘因**——研發成本高，需以獨占權讓發明人回收成本，才有誘因創新。
- **公開換獨占(disclosure for exclusivity)**：這是專利與營業秘密最根本的取捨差異。

## 一、三種專利（核心！）
| | 發明專利 | 新型專利 | 設計專利 |
|---|---|---|---|
| **保護標的** | 利用自然法則之技術思想「創作」 | 物品之**形狀、構造或組合** | 物品外觀之**視覺**設計（形狀、花紋、色彩）|
| **審查方式** | **實體審查**（嚴格審新穎性、進步性）| **形式審查**（只查格式，較寬鬆）| 實體審查 |
| **保護期間** | **20年** | **10年** | **15年** |
| **重點** | 技術功能 | 實體物品的小發明 | 視覺外觀，不問功能 |
| **權利穩定性** | 高 | 較低（未實審）| 高 |

> 記法：發明最高階（20年、實審）；新型是「小發明」（10年、形式審查、僅限實體物品）；設計重外觀（15年）。

## 二、專利三大要件（可專利性）
1. **產業利用性(utility)**：可供產業上實際製造或使用（永動機因違反自然法則無法製造，欠缺此要件）。
2. **新穎性(novelty)**：申請前未見於先前技術(prior art)、未公開、未公開使用。
3. **進步性(non-obviousness/inventive step)**：對「該技術領域中具通常知識者(PHOSITA)」而言，非能輕易完成。
> **先前技術(prior art)**：申請日前已公開的所有技術資訊。
> **PHOSITA**：person having ordinary skill in the art，判斷進步性的虛擬基準人。

## 三、「發明」的定義與「非發明」
**發明** = 「利用自然法則之**技術思想**的創作」，須具**技術性(technical character)**。
**不屬於發明者（常考！）**：
- **自然法則本身**：如萬有引力、能量守恆（既存真理，非人為創作）。
- **單純發現(discovery)**：發現自然界既有的物質或現象（如發現新礦物）。
- **違反自然法則者**：如永動機（違反能量/質量守恆）。
- **非利用自然法則者**：數學公式、**遊戲/運動規則**、心智步驟、商業方法、人為的約定。
- **單純的資訊揭示、單純美術創作**：屬其他法律保護（著作權）。

> 但若「演算法、商業方法」**結合具體技術手段**解決技術問題，整體仍可能具技術性而可專利（軟體專利的判準）。

## 四、物之發明 vs 方法發明
- **物之發明**：表現於「物」（物質如化合物、物品如裝置）。保護範圍 = 該物本身（不論用何方法製造）。
- **方法發明**：表現於「方法」（製造方法、處理方法、用途）。只保護「該特定方法」。
- ∴ **物之發明保護範圍 > 方法發明**（若物品有多種製法，未註冊的製法不受拘束）。
- 一個發明專利可**同時包含**物與方法（如「化合物及其製造方法」）。

## 五、新型專利的限制
- 僅限**實體物品**的形狀、構造或組合 → **不保護**氣態、液態、粉末等不具固定型態的物質，也不保護「方法」。
- 採形式審查，故另設**新型專利技術報告**制度，供權利人行使權利前評估有效性。

## 六、設計專利的兩大特性
- **物品性**：須「應用於物品」之外觀、供產業利用（純藝術創作歸著作權）。
- **視覺性**：訴諸視覺的具體設計，**不要求功能改良、不解決技術問題**（這是與發明/新型最大差異）。
- 應用於物品的**電腦圖像(icon)** 與**圖形化使用者介面(GUI)** 也可申請設計專利。
- **部分設計、成組設計**亦可申請。

## 七、衍生專利／衍生設計
- **再發明/再新型**：利用他人專利之主要技術所完成的發明。雖有自己的專利，**實施時須獲原專利權人授權**；協商不成且符合要件可申請**強制授權(compulsory license)**。
- **衍生設計(第127條)**：同一人就「近似於原設計」的設計申請。限制：申請日不得早於原設計；於原設計**公告後不得**申請；不得就「僅與衍生設計近似而與原設計不近似」者申請。

## 八、專利權的取得與限制
- 採**先申請主義**、**屬地主義**。
- 須經申請、（發明）實體審查、公告。
- 權利限制：研究實驗免責、權利耗盡、先使用權、強制授權等。

## 〇、保護營業秘密的法理
- **契約理論**：以保密約定、競業禁止約定保護。
- **侵權行為理論**：基於當事人間的**信賴關係(confidential relations)**。批評：侵害不僅損害私益，也破壞市場競爭秩序。
- **反不正競爭理論**：保護社會利益、競爭秩序（我國第1條「維護產業倫理與競爭秩序」）。批評：侵害人目的未必是競爭（如單純竊取轉售）。
- **財產理論(property theory)**：視為**無體財產/智慧財產**（洛克 labor-desert）。**目前多數國家採此**，為積極權利（可讓與、授權、排除侵害），但保護範圍與權利外觀較不明確。

## 一、三大要件（第2條，必考！）
**營業秘密**：方法、技術、製程、配方、程式、設計或其他「可用於生產、銷售或經營之資訊」，且符合三要件：
1. **秘密性（非周知性）**：非一般涉及該類資訊之人所知。
2. **經濟價值**：因其秘密性而具有「實際或潛在」之經濟價值。
3. **合理保密措施**：所有人已採取合理之保密措施。
> 三者**缺一不可**。經典例子：可口可樂配方。

## 二、秘密性的判斷標準
| 標準 | 採用 | 內涵 |
|---|---|---|
| **業界標準** | **我國**、TRIPS 39(2) | 「非一般涉及該類資訊之**業界人士**所知」即可 |
| 公眾標準 | 日本、美國 | 看「一般民眾」是否知悉 |
> **公眾資訊的「組合」**也可能成為營業秘密（Imperial Chemical 案）：個別元件雖在公共領域，但獨特組合具競爭優勢，整體仍受保護。

## 三、經濟價值
- **實際價值**：目前可實現的經濟利益。
- **潛在價值**：未來可獲得的利益，包含**市佔率、研發能力、競爭優勢**等。
> 反例（智財法院107民營訴2）：僅有名稱、地址、聯絡方式且可輕易查得的客戶名單，或單純的市場價格資訊，難認有秘密性及經濟價值。

## 四、合理保密措施（need-to-know）
**需知原則(need-to-know)**：只讓「業務上有需要」的人知道。
- **與知悉人數無關**（必要的多人知悉仍可），須視營業秘密種類、實際經營情形、行業一般預防措施。
- 例：標示「機密/Confidential」、區域門禁管制、員工分級授權、文件密等、電腦帳號與網路特殊設定、檔案加密、離職規定、文件可否攜出。
- 反例（高院97勞上易28）：僅「開會後收回文件」、無明確保密作為，難認已採取合理保密措施。
- 實例：台積電一年管8千條機密、列印用金屬紙、員工電郵全掃描。

## 五、營業秘密之侵害（第10條）
五種侵害態樣：
1. 以**不正當方法**取得營業秘密。
2. 知悉或**因重大過失而不知**其為前款營業秘密，而取得、使用或洩漏。
3. 取得後始知悉（或重大過失不知），而使用或洩漏。
4. 因法律行為取得，而以不正當方法使用或洩漏。
5. 依法令有守密義務，而使用或無故洩漏。

> **不正當方法**：竊盜、詐欺、脅迫、賄賂、擅自重製、違反保密義務、引誘他人違反保密義務或其他類似方法。
> **重點：重大過失而不知，仍構成侵害**（非僅限故意）。

**還原工程(reverse engineering)**：合法取得產品後拆解分析 → **原則上屬正當方法**（這是營業秘密保護的內在界線——擋不住合法逆向破解或他人獨立研發）。

## 六、救濟手段
| 類型 | 條文 | 內容 |
|---|---|---|
| **不作為請求權** | 第11條 | 排除侵害、防止侵害之虞、銷燬侵害物 |
| **損害賠償** | 第12條 | 故意/過失負責；時效：知悉起**2年**、行為時起**10年** |
| **刑事責任（境內）** | 第13之1 | 5年以下徒刑，罰金100萬~1000萬；未遂犯罰之 |
| **刑事責任（域外加重）** | 第13之2 | 意圖在外國、大陸、港澳使用：1~10年，罰金300萬~5000萬 |

## 七、競業禁止
**競業禁止(non-compete)**：限制員工在職或離職後從事與雇主競爭的業務。
**(一) 法定競業禁止**：
- 民法第562、563條：經理人、代辦商非經商號允許，不得經營同類事業。
- 公司法第32、34條：經理人不得兼任他營利事業經理人或自營同類業務。

**(二) 約定競業禁止 — 勞基法第9條之1（四要件，必考！）**：
未符合下列要件者，雇主不得與勞工為「離職後」競業禁止約定：
1. 雇主有**應受保護之正當營業利益**。
2. 勞工的職位/職務**能接觸或使用**雇主的營業秘密。
3. 競業禁止的**期間、區域、職業活動範圍及就業對象，未逾合理範疇**。
4. 雇主對勞工因不從事競業所受損失有**合理補償**（**不包括**在職期間的薪資）。
> **違反任一要件 → 約定無效**。**離職後競業禁止最長2年**，逾2年縮短為2年。

## 八、營業秘密 vs 競業禁止
| | 營業秘密 | 競業禁止 |
|---|---|---|
| 法源 | 營業秘密法、契約 | 公司法、民法、勞基法、契約 |
| 限制標的 | 秘密資訊本身 | 一定期間/區域/活動/對象的就業 |
| 期間 | **無限制（至公開為止）** | 離職後最長2年 |
| 違反效果 | 損害賠償、刑事責任 | 契約約定責任（損害賠償等）|

## 一、四大智慧財產權總比較（必背！）
| | 營業秘密 | 專利 | 著作權 | 商標 |
|---|---|---|---|---|
| **保護客體** | 秘密資訊 | 發明/新型/設計 | 具原創性之著作（表達）| 具識別性之標識 |
| **核心要件** | 秘密性、經濟價值、保密措施 | 產業利用性、新穎性、進步性 | 原創性 | 識別性 |
| **取得方式** | 保密即可（不註冊）| 申請＋審查 | **完成自動取得** | 申請註冊 |
| **是否公開** | 否（保密）| **是（公開換獨占）** | 公開發表（非必要）| 註冊公告 |
| **保護期間** | 至公開為止 | 20/10/15年 | 死後50年 | 10年（可延展）|
| **屆滿後** | 公開即失保護 | 進入公共領域 | 進入公共領域 | 可永續延展 |
| **立法目的** | 維護產業倫理與競爭秩序 | 鼓勵發明、促進產業發展 | 保障著作人、促進文化發展 | 保障商標權與消費者、公平競爭 |

> 記法（立法目的）：**產業倫理→營業秘密**；**產業發展→專利**；**文化發展→著作**；**公平競爭＋消費者→商標**。

## 二、三大智慧財產保護原理（哲學基礎）
| 理論 | 提出者 | 核心主張 |
|---|---|---|
| **勞動理論(Labor-Desert)** | 洛克(Locke) | 天賦權利(Natural Rights)：人付出勞動於創作，即應擁有成果 |
| **人格理論(Personhood)** | 黑格爾(Hegel) | 財產是人格的延伸與自由的體現 |
| **功利主義(Utilitarian)** | 邊沁等 | 經濟誘因(incentive)：以限時排他權鼓勵創新，期滿貢獻社會 |
> 美國憲法 Art. I §8 cl.8（promote the Progress of Science and useful Arts）即體現功利主義。

## 三、原創性／新穎性的高低
- **專利新穎性最高**：須世界首創、先申請者得之；後發明者縱獨立完成也不行。
- **著作權原創性最低**：只需獨立創作＋微量創意；兩人各自獨立創作的雷同作品**都受保護**。
- → 這是著作權與專利「本質不同」的關鍵。

## 四、一物多權（重疊保護）
同一標的可能同時受多種智慧財產權保護：
- **產品外觀**：設計專利 ＋ 著作權（美術著作）＋ 立體商標。
- **品牌logo**：著作權（美術著作）＋ 商標。
- **一首歌**：音樂著作（詞曲）＋ 錄音著作 ＋ 表演 ＋ 商標（藝名/標誌）。
- **演算法**：發明專利（結合技術手段）／營業秘密（保密）／著作權（原始碼表達）。

## 五、保護策略的取捨：專利 vs 營業秘密
| | 專利 | 營業秘密 |
|---|---|---|
| 取得方式 | 公開技術 | 保持秘密 |
| 期間 | 限時（20年）| 無限期（至公開）|
| 防護範圍 | 可排除他人實施（含獨立研發者）| **無法**排除獨立研發或還原工程 |
| 適合 | 易被逆向破解的技術 | 難破解的配方（如可口可樂）|

## 六、救濟手段共通點
- **民事**：排除侵害請求權、防止侵害請求權、損害賠償、銷毀侵害物。
- **刑事**：營業秘密、商標、著作權、專利（特定情形）皆設有刑責。
- 一行為可能**同時侵害多種權利**（如仿冒品同時侵害商標權與著作權）。

## 七、考前衝刺重點
- **商標(35%)**：識別性光譜「通描暗任獨」、第二意義、混淆誤認八要素、著名商標淡化、合理使用、屬地/註冊/先申請三主義。
- **著作(35%)**：原創性、思想表達二分法、人格權vs財產權（人格權不得讓與）、合理使用四基準、職務vs出資、創作保護主義。
- **專利(10%)**：三種專利（20/10/15、實審vs形式審）、發明定義與非發明、物vs方法、設計專利物品性+視覺性。
- **營業秘密(10%)**：三要件、業界標準、還原工程正當、競業禁止四要件＋2年、域外加重。
- **綜合(10%)**：四大IP比較表、三大保護原理、一物多權、立法目的對照。
` }
];

function renderMD(md) {
  let html = md
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3 class="font-display text-xl text-navy mt-5 mb-2 font-semibold">$1</h3>')
    .replace(/^## (.+)$/gm, '<h2 class="font-display text-2xl text-oxblood mt-6 mb-3 font-semibold">$1</h2>')
    .replace(/^> (.+)$/gm, '<blockquote class="border-l-4 border-gold pl-4 py-1 my-3 italic text-navy bg-gold/5">$1</blockquote>')
    .replace(/^---$/gm, '<hr class="my-5 border-slate/20"/>');
  const tableRegex = /((?:\|[^\n]+\|\n?)+)/g;
  html = html.replace(tableRegex, (match) => {
    const rows = match.trim().split('\n').filter(r => r.includes('|'));
    if (rows.length < 2) return match;
    const cells = rows.map(r => r.split('|').slice(1, -1).map(c => c.trim()));
    const isSep = (row) => row.every(c => /^:?-+:?$/.test(c));
    const header = cells[0];
    const body = cells.slice(1).filter(r => !isSep(r));
    return `<table class="my-4 w-full text-sm border-collapse">
      <thead><tr class="bg-navy/10">${header.map(h => `<th class="px-3 py-2 text-left font-display font-semibold text-navy border-b-2 border-navy/30">${h.replace(/\*\*(.+?)\*\*/g,'$1')}</th>`).join('')}</tr></thead>
      <tbody>${body.map(row => `<tr class="border-b border-slate/15">${row.map(c => `<td class="px-3 py-2 align-top">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  });
  html = html.replace(/^\d+\. (.+)$/gm, '<li class="ml-5 list-decimal">$1</li>');
  html = html.replace(/^- (.+)$/gm, '<li class="ml-5 list-disc">$1</li>');
  html = html.replace(/(<li[^>]*>.*<\/li>\n?)+/g, m => `<ul class="my-2 space-y-1">${m}</ul>`);
  html = html.split('\n\n').map(p => (p.startsWith('<')||p.trim()==='')?p:`<p class="my-3">${p.replace(/\n/g,'<br/>')}</p>`).join('\n');
  return html;
}

function QuizMode({progress,setProgress,unfam,toggleUnfam}) {
  const [topic,setTopic]=useState("全部");
  const [onlyUnans,setOnlyUnans]=useState(false);
  const [frozen,setFrozen]=useState([]);
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [show,setShow]=useState(false);
  const base=useMemo(()=>topic==="全部"?MC:MC.filter(q=>q.t===topic),[topic]);
  const qs=useMemo(()=>onlyUnans?base.filter(q=>frozen.includes(q.id)):base,[base,onlyUnans,frozen]);
  const unansCount=base.filter(q=>!(q.id in progress)).length;
  // 進入練習或切換時，自動跳到第一題沒寫過的；開啟「只練沒寫過」時凍結當下未作答清單
  useEffect(()=>{
    if(onlyUnans){
      const ids=base.filter(q=>!(q.id in progress)).map(q=>q.id);
      setFrozen(ids); setIdx(0);
    } else {
      const f=base.findIndex(q=>!(q.id in progress));
      setIdx(f>=0?f:0);
    }
    setSel(null); setShow(false);
  },[topic,onlyUnans]);
  if(!base.length)return null;
  const q=qs[idx];
  const choose=(i)=>{
    if(sel!==null||!q)return;
    setSel(i);setShow(true);
    const np={...progress,[q.id]:{selected:i,correct:i===q.a}};
    setProgress(np);saveProgress(np);
  };
  const next=()=>{if(idx<qs.length-1){setIdx(idx+1);setSel(null);setShow(false);}};
  const prev=()=>{if(idx>0){setIdx(idx-1);setSel(null);setShow(false);}};
  const jumpNextUnans=()=>{
    let n=-1;
    for(let k=idx+1;k<qs.length;k++){ if(!(qs[k].id in progress)){n=k;break;} }
    if(n===-1){ for(let k=0;k<qs.length;k++){ if(!(qs[k].id in progress)){n=k;break;} } }
    if(n>=0){ setIdx(n); setSel(null); setShow(false); }
  };
  return (
    <main className="max-w-3xl mx-auto px-4 py-6 sm:py-8">
      <TopicFilter topic={topic} setTopic={setTopic}/>
      <div className="flex flex-wrap items-center gap-3 mb-6 -mt-2">
        <button onClick={()=>setOnlyUnans(v=>!v)} className={`px-4 py-1.5 rounded-full text-xs tracking-wider transition-all ${onlyUnans?'bg-steel text-cream':'bg-cream border border-steel/50 text-steel hover:bg-steel/10'}`}>
          {onlyUnans?'✓ 只練沒寫過':'只練沒寫過'} ({unansCount})
        </button>
        <span className="text-xs text-slate">{onlyUnans?'已過濾掉做過的題目':'自動從第一題沒寫過的開始'}</span>
      </div>
      {!q ? (
        <div className="paper rounded-lg p-10 gilt text-center">
          <div className="text-4xl mb-3 text-steel">✓</div>
          <p className="font-display text-xl text-navy mb-2">這個範圍的題目都寫過了！</p>
          <p className="text-sm text-slate">可以切換主題、關閉「只練沒寫過」，或到複習區加強錯題與不熟的題目。</p>
        </div>
      ) : (
      <div className="paper rounded-lg p-6 sm:p-8 gilt fade-in" key={q.id}>
        <div className="flex justify-between items-center mb-6">
          <div className="flex items-center gap-2">
            <span className={`tag bg-${TOPIC_COLOR[q.t]} text-cream`}>{TOPIC_FULL[q.t]}</span>
            {q.d===2 && <span className="tag bg-ink/80 text-cream">進階</span>}
            {unfam.includes(q.id) && <span className="tag bg-brass text-cream">不熟</span>}
          </div>
          <span className="text-xs text-slate">{idx+1} / {qs.length}</span>
        </div>
        <h2 className="font-serif text-lg leading-relaxed text-ink mb-6">
          <span className="text-oxblood font-display font-semibold mr-2">{q.id}.</span>{q.q}
        </h2>
        <div className="space-y-3 mb-6">
          {q.c.map((c,i)=>{
            const L=String.fromCharCode(65+i);
            let cls="choice-btn";
            if(sel!==null){if(i===q.a)cls+=" correct";else if(i===sel)cls+=" wrong";}
            return (
              <button key={i} onClick={()=>choose(i)} disabled={sel!==null} className={`${cls} w-full px-4 py-3 rounded-md flex items-start gap-3`}>
                <span className="font-display font-semibold text-oxblood shrink-0">{L}.</span>
                <span className="text-ink/90 leading-relaxed">{c}</span>
                {sel!==null&&i===q.a&&<span className="ml-auto text-green-700">✓</span>}
                {sel!==null&&i===sel&&i!==q.a&&<span className="ml-auto text-oxblood">✗</span>}
              </button>
            );
          })}
        </div>
        {show&&(
          <div className="fade-in border-t border-slate/20 pt-5">
            <div className="flex items-center justify-between mb-3">
              <div className="divider-ornament text-xs tracking-[0.3em] uppercase flex-1">解析</div>
              <button onClick={()=>toggleUnfam(q.id)} className={`ml-3 px-3 py-1 rounded-full text-xs whitespace-nowrap transition-all ${unfam.includes(q.id)?'bg-brass text-cream':'border border-brass text-brass hover:bg-brass/10'}`}>
                {unfam.includes(q.id)?'★ 已標記不熟':'☆ 標記不熟'}
              </button>
            </div>
            <p className="text-ink/85 leading-relaxed whitespace-pre-line" dangerouslySetInnerHTML={{__html:q.e.replace(/\*\*(.+?)\*\*/g,'<strong class="text-oxblood">$1</strong>')}}/>
          </div>
        )}
        <div className="flex justify-between items-center mt-6 pt-6 border-t border-slate/15">
          <button onClick={prev} disabled={idx===0} className="px-4 py-2 text-sm text-slate disabled:opacity-30 hover:text-navy">← 上一題</button>
          <div className="flex gap-1">
            {qs.slice(Math.max(0,idx-3),Math.min(qs.length,idx+4)).map((qq,i)=>{
              const ri=Math.max(0,idx-3)+i;const st=progress[qq.id];
              return <button key={qq.id} onClick={()=>{setIdx(ri);setSel(null);setShow(false);}} className={`w-2 h-2 rounded-full transition-all ${ri===idx?'w-6 bg-navy':st?.correct?'bg-green-600':st?'bg-oxblood/40':'bg-slate/20'}`}/>;
            })}
          </div>
          <button onClick={next} disabled={idx===qs.length-1} className="px-4 py-2 text-sm text-slate disabled:opacity-30 hover:text-navy">下一題 →</button>
        </div>
        {unansCount>0 && (
          <div className="mt-4 text-center">
            <button onClick={jumpNextUnans} className="text-xs text-steel hover:text-navy underline underline-offset-4">跳到下一題沒寫過的 →</button>
          </div>
        )}
      </div>
      )}
    </main>
  );
}

                    {q.d===2 && <span className="tag bg-ink/80 text-cream">進階</span>}
                  </span>
                  <p className="font-serif text-base text-ink leading-relaxed">{q.q}</p>
                </div>
                <span className={`text-slate text-xl transition-transform ${exp.has(q.id)?'rotate-180':''}`}>⌄</span>
              </div>
            </button>
            {exp.has(q.id)&&(
              <div className="fade-in mt-4 pt-4 border-t border-slate/15">
                <div className="space-y-2 mb-4">
                  {q.c.map((c,i)=>(
                    <div key={i} className={`px-3 py-2 rounded text-sm leading-relaxed flex items-start gap-2 ${i===q.a?'bg-navy/8 border-l-3 border-navy text-navy font-medium':'text-ink/70'}`}>
                      <span className="font-display font-semibold shrink-0">{String.fromCharCode(65+i)}.</span><span>{c}</span>
                      {i===q.a&&<span className="ml-auto">✓ 正解</span>}
                    </div>
                  ))}
                </div>
                <div className="bg-ivory/70 rounded-md p-4 border-l-4 border-oxblood">
                  <div className="text-xs tracking-[0.2em] uppercase text-oxblood mb-2 font-medium">詳解</div>
                  <p className="text-sm text-ink/85 leading-relaxed whitespace-pre-line" dangerouslySetInnerHTML={{__html:q.e.replace(/\*\*(.+?)\*\*/g,'<strong class="text-oxblood">$1</strong>')}}/>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </main>
  );
}

function NotesMode() {
  const [sel,setSel]=useState("商標");
  const note=NOTES.find(n=>n.id===sel);
  return (
    <main className="max-w-6xl mx-auto px-4 py-6 sm:py-8">
      <div className="grid lg:grid-cols-[220px_1fr] gap-6">
        <aside className="lg:sticky lg:top-24 lg:self-start">
          <div className="paper rounded-lg p-4 gilt">
            <div className="text-xs tracking-[0.3em] uppercase text-brass mb-3 px-2">主題</div>
            <div className="space-y-1">
              {NOTES.map(n=>(
                <button key={n.id} onClick={()=>setSel(n.id)} className={`w-full text-left px-3 py-2 rounded text-sm transition-all flex justify-between items-center ${sel===n.id?'bg-navy text-cream':'hover:bg-ivory text-ink/70'}`}>
                  <span>{n.title.replace('重點整理','').replace('比較重點整理','比較')}</span>
                  <span className={`text-xs ${sel===n.id?'text-cream/70':'text-slate'}`}>{n.weight}</span>
                </button>
              ))}
            </div>
          </div>
        </aside>
        <div className="paper rounded-lg p-6 sm:p-10 gilt fade-in" key={sel}>
          <div className="flex items-center gap-3 mb-2">
            <h2 className="font-serif text-3xl font-bold text-navy">{note.title}</h2>
            <span className="tag bg-oxblood text-cream">{note.weight}</span>
          </div>
          <div className="divider-ornament text-xs tracking-[0.3em] uppercase mb-5">Summary</div>
          <article className="notes-content text-ink/85" dangerouslySetInnerHTML={{__html:renderMD(note.body)}}/>
        </div>
      </div>
    </main>
  );
}

function ReviewMode({progress, unfam, toggleUnfam}) {
  const [filter, setFilter] = useState("全部");
  const wrongIds = Object.entries(progress).filter(([id,p])=>!p.correct).map(([id])=>parseInt(id));
  const notDoneIds = MC.filter(q=>!(q.id in progress)).map(q=>q.id);
  let ids;
  if (filter==="錯題") ids = wrongIds;
  else if (filter==="不熟") ids = [...unfam];
  else if (filter==="沒寫過") ids = notDoneIds;
  else ids = [...new Set([...wrongIds, ...unfam, ...notDoneIds])];
  const qs = MC.filter(q=>ids.includes(q.id)).sort((a,b)=>a.id-b.id);
  const [exp, setExp] = useState(new Set());
  const toggle=(id)=>{const n=new Set(exp);n.has(id)?n.delete(id):n.add(id);setExp(n);};

  return (
    <main className="max-w-3xl mx-auto px-4 py-6 sm:py-8">
      <div className="paper rounded-lg p-6 gilt mb-6">
        <div className="divider-ornament text-xs tracking-[0.3em] uppercase mb-3">複習專區</div>
        <p className="text-sm text-slate leading-relaxed mb-4">
          這裡集中收錄你<strong className="text-oxblood">答錯</strong>、<strong className="text-brass">標記不熟</strong>、以及<strong className="text-steel">還沒寫過</strong>的題目，方便重點複習。答對或取消標記後會自動更新。
        </p>
        <div className="flex flex-wrap gap-4 text-sm">
          <span className="text-slate">錯題 <strong className="text-oxblood">{wrongIds.length}</strong></span>
          <span className="text-slate">不熟 <strong className="text-brass">{unfam.length}</strong></span>
          <span className="text-slate">沒寫過 <strong className="text-steel">{notDoneIds.length}</strong></span>
        </div>
      </div>

      <div className="flex flex-wrap gap-2 mb-6">
        {["全部","錯題","不熟","沒寫過"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} className={`px-4 py-1.5 rounded-full text-sm tracking-wider transition-all ${filter===f?'bg-navy text-cream':'bg-cream border border-slate/30 text-slate hover:bg-ivory'}`}>
            {f}{f==="錯題"?` (${wrongIds.length})`:f==="不熟"?` (${unfam.length})`:f==="沒寫過"?` (${notDoneIds.length})`:''}
          </button>
        ))}
      </div>

      {qs.length===0 ? (
        <div className="paper rounded-lg p-10 gilt text-center">
          <div className="text-4xl mb-3 text-brass">✓</div>
          <p className="font-serif text-lg text-navy mb-2">這個分類目前沒有題目</p>
          <p className="text-sm text-slate">去「練習」模式作答，答錯或標記不熟的題目會出現在這裡。</p>
        </div>
      ) : (
        <div className="space-y-3">
          {qs.map(q=>{
            const wasWrong = progress[q.id] && !progress[q.id].correct;
            return (
              <div key={q.id} className="paper rounded-lg p-5 gilt">
                <button onClick={()=>toggle(q.id)} className="w-full text-left">
                  <div className="flex items-start gap-3">
                    <span className="font-display font-semibold text-oxblood shrink-0">{q.id}.</span>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <span className={`tag bg-${TOPIC_COLOR[q.t]} text-cream`}>{TOPIC_FULL[q.t]}</span>
                        {q.d===2 && <span className="tag bg-ink/80 text-cream">進階</span>}
                        {wasWrong && <span className="tag bg-oxblood text-cream">曾答錯</span>}
                        {unfam.includes(q.id) && <span className="tag bg-brass text-cream">不熟</span>}
                        {!(q.id in progress) && <span className="tag bg-steel text-cream">沒寫過</span>}
                      </div>
                      <p className="font-serif text-base text-ink leading-relaxed">{q.q}</p>
                    </div>
                    <span className={`text-slate text-xl transition-transform ${exp.has(q.id)?'rotate-180':''}`}>⌄</span>
                  </div>
                </button>
                {exp.has(q.id)&&(
                  <div className="fade-in mt-4 pt-4 border-t border-slate/15">
                    <div className="space-y-2 mb-4">
                      {q.c.map((c,i)=>(
                        <div key={i} className={`px-3 py-2 rounded text-sm leading-relaxed flex items-start gap-2 ${i===q.a?'bg-navy/8 border-l-3 border-navy text-navy font-medium':'text-ink/70'}`}>
                          <span className="font-display font-semibold shrink-0">{String.fromCharCode(65+i)}.</span><span>{c}</span>
                          {i===q.a&&<span className="ml-auto">✓ 正解</span>}
                        </div>
                      ))}
                    </div>
                    <div className="bg-ivory/70 rounded-md p-4 border-l-4 border-oxblood mb-3">
                      <div className="text-xs tracking-[0.2em] uppercase text-oxblood mb-2 font-medium">詳解</div>
                      <p className="text-sm text-ink/85 leading-relaxed whitespace-pre-line" dangerouslySetInnerHTML={{__html:q.e.replace(/\*\*(.+?)\*\*/g,'<strong class="text-oxblood">$1</strong>')}}/>
                    </div>
                    <button onClick={()=>toggleUnfam(q.id)} className={`px-3 py-1 rounded-full text-xs transition-all ${unfam.includes(q.id)?'bg-brass text-cream':'border border-brass text-brass hover:bg-brass/10'}`}>
                      {unfam.includes(q.id)?'★ 取消不熟標記':'☆ 標記不熟'}
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </main>
  );
}

function App() {
  const [view,setView]=useState('home');
  const [progress,setProgress]=useState(loadProgress());
  const [unfam,setUnfam]=useState(loadUnfam());
  const toggleUnfam=(id)=>{
    setUnfam(prev=>{
      const next = prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id];
      saveUnfam(next);
      return next;
    });
  };
  return (
    <div className="min-h-screen">
      <Header view={view} setView={setView}/>
      {view==='home'&&<Home progress={progress} unfam={unfam} setView={setView}/>}
      {view==='quiz'&&<QuizMode progress={progress} setProgress={setProgress} unfam={unfam} toggleUnfam={toggleUnfam}/>}
      {view==='study'&&<StudyMode/>}
      {view==='notes'&&<NotesMode/>}
      {view==='review'&&<ReviewMode progress={progress} unfam={unfam} toggleUnfam={toggleUnfam}/>}
      <footer className="max-w-5xl mx-auto px-4 py-8 text-center text-xs text-slate/70 tracking-wider">
        ◆ 科技法導論複習筆記 · 智慧財產權 · for Winona ◆
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
